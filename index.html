<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Maths Teaching Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a0e1a;
  --navy2:#121830;
  --orange:#ff6b2b;
  --yellow:#ffd600;
  --cyan:#00e5ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;
  background:var(--navy);
  color:#fff;
  font-family:'Rajdhani',sans-serif;
  font-size:28px;
  font-weight:600;
  overflow:hidden;
}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;}

/* Animated background mesh + stars */
#bg-mesh{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,107,43,.16), transparent 38%),
    radial-gradient(circle at 85% 15%, rgba(0,229,255,.16), transparent 40%),
    radial-gradient(circle at 50% 85%, rgba(255,214,0,.12), transparent 45%),
    var(--navy);
  background-size:200% 200%;
  animation:meshDrift 26s ease-in-out infinite;
}
@keyframes meshDrift{
  0%{background-position:0% 0%, 100% 0%, 50% 100%;}
  50%{background-position:60% 40%, 30% 60%, 70% 30%;}
  100%{background-position:0% 0%, 100% 0%, 50% 100%;}
}
#bg-stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{
  position:absolute;border-radius:50%;
  background:#fff;opacity:.5;
  animation:starDrift linear infinite;
}
@keyframes starDrift{
  from{transform:translateY(0) translateX(0);}
  to{transform:translateY(-40px) translateX(20px);}
}
@keyframes starTwinkle{
  0%,100%{opacity:.15;}
  50%{opacity:.9;}
}

/* Screens */
.screen{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:none;flex-direction:column;
  padding:40px 60px;
  overflow-y:auto;
  z-index:1;
}
.screen.active{display:flex;}
.screen.enter{animation:levelIn .5s cubic-bezier(.2,.7,.3,1.1) forwards;}
@keyframes levelIn{
  from{opacity:0;transform:translateX(80px) scale(.97);filter:blur(6px);}
  to{opacity:1;transform:translateX(0) scale(1);filter:blur(0);}
}

/* Breadcrumb */
.breadcrumb{
  display:flex;align-items:center;gap:12px;
  font-size:26px;font-weight:700;color:var(--cyan);margin-bottom:18px;flex-wrap:wrap;
  text-shadow:0 0 12px rgba(0,229,255,.5);
}
.breadcrumb span{cursor:pointer;transition:.15s;}
.breadcrumb span:hover{color:var(--yellow);text-shadow:0 0 16px rgba(255,214,0,.7);}
.breadcrumb .sep{color:#445;text-shadow:none;}

.back-btn{
  background:linear-gradient(135deg,var(--navy2),#1c2647);
  border:3px solid var(--cyan);
  color:#fff;
  border-radius:14px;
  padding:16px 34px;
  font-size:26px;
  font-weight:700;
  font-family:'Rajdhani',sans-serif;
  letter-spacing:1px;
  cursor:pointer;
  min-height:60px;
  margin-bottom:24px;
  align-self:flex-start;
  transition:.2s;
  box-shadow:0 0 16px rgba(0,229,255,.25);
}
.back-btn:hover{
  background:var(--cyan);color:var(--navy);
  box-shadow:0 0 35px rgba(0,229,255,.8);
  transform:translateY(-2px);
}

h1{
  font-family:'Orbitron',sans-serif;
  font-size:88px;font-weight:900;margin-bottom:6px;
  letter-spacing:2px;
  background:linear-gradient(90deg,var(--orange),var(--yellow) 45%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(0,229,255,.35));
  position:relative;display:inline-block;
}
h1::after{
  content:'';display:block;height:6px;width:100%;
  margin-top:18px;border-radius:6px;
  background:linear-gradient(90deg,var(--orange),var(--yellow),var(--cyan));
  box-shadow:0 0 24px 4px rgba(0,229,255,.6);
  animation:underlineGlow 3s ease-in-out infinite;
}
@keyframes underlineGlow{
  0%,100%{box-shadow:0 0 18px 2px rgba(255,107,43,.6);}
  50%{box-shadow:0 0 30px 6px rgba(0,229,255,.8);}
}
.tagline{font-size:30px;color:var(--cyan);margin:26px 0 10px;font-weight:600;text-shadow:0 0 10px rgba(0,229,255,.4);}
h2{
  font-family:'Orbitron',sans-serif;
  font-size:46px;font-weight:800;margin-bottom:24px;color:var(--yellow);
  text-shadow:0 0 18px rgba(255,214,0,.5);letter-spacing:1px;
}

/* Card grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:38px;
  margin-top:10px;
}
.card{
  position:relative;
  background:linear-gradient(160deg,#141b38,#1c2750 60%,#222d5c);
  border:4px solid var(--cyan);
  border-radius:26px;
  padding:34px;
  min-height:300px;
  display:flex;flex-direction:column;justify-content:flex-end;
  cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.7,.3,1.2), box-shadow .25s, border-color .25s;
  font-family:'Rajdhani',sans-serif;
  font-size:60px;font-weight:700;
  box-shadow:0 10px 34px rgba(0,0,0,.5);
  overflow:hidden;
  opacity:0;transform:translateY(50px) scale(.9);
  animation:cardPop .55s cubic-bezier(.2,.8,.25,1.15) forwards;
  animation-delay:calc(var(--i,0) * 70ms);
}
@keyframes cardPop{
  0%{opacity:0;transform:translateY(60px) scale(.85);}
  60%{opacity:1;transform:translateY(-8px) scale(1.04);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:22px;
  border:4px solid transparent;pointer-events:none;
  animation:borderPulse 3.2s ease-in-out infinite;
}
@keyframes borderPulse{
  0%{box-shadow:inset 0 0 28px rgba(255,107,43,.45),0 0 18px rgba(255,107,43,.35);}
  33%{box-shadow:inset 0 0 28px rgba(0,229,255,.45),0 0 18px rgba(0,229,255,.35);}
  66%{box-shadow:inset 0 0 28px rgba(255,214,0,.45),0 0 18px rgba(255,214,0,.35);}
  100%{box-shadow:inset 0 0 28px rgba(255,107,43,.45),0 0 18px rgba(255,107,43,.35);}
}
.card .icon{
  font-size:120px;line-height:1;margin-bottom:20px;
  filter:drop-shadow(0 0 18px rgba(0,229,255,.6));
  align-self:flex-start;
}
.card .sub{font-size:26px;font-weight:600;color:var(--cyan);margin-top:10px;text-shadow:0 0 8px rgba(0,229,255,.5);}
.card:hover, .card:focus-visible{
  transform:translateY(-14px) scale(1.06);
  border-color:var(--yellow);
  box-shadow:0 0 70px 12px rgba(255,214,0,.65), 0 20px 50px rgba(0,0,0,.6);
  z-index:5;
}
.card.add{
  border:4px dashed var(--orange);
  background:rgba(255,107,43,.06);
  align-items:center;justify-content:center;text-align:center;color:var(--orange);
}

/* Progress bar */
.progress-bar-track{
  width:100%;height:14px;background:#0d1326;border-radius:8px;
  overflow:hidden;margin-bottom:26px;border:1px solid #334;
}
.progress-bar-fill{
  height:100%;width:0%;border-radius:8px;
  background:linear-gradient(90deg,var(--orange),var(--yellow),var(--cyan));
  box-shadow:0 0 18px rgba(0,229,255,.7);
  transition:width .5s cubic-bezier(.2,.7,.3,1);
}

/* Lesson view sections */
.lesson-tabs{display:flex;gap:24px;margin-bottom:26px;}
.lesson-tab{
  background:linear-gradient(160deg,var(--navy2),#1c2750);
  border:3px solid #334;
  border-radius:16px;padding:18px 36px;font-size:28px;font-weight:700;
  cursor:pointer;min-height:60px;transition:.2s;
  font-family:'Rajdhani',sans-serif;letter-spacing:.5px;
}
.lesson-tab.active{
  border-color:var(--orange);color:var(--orange);
  box-shadow:0 0 28px rgba(255,107,43,.55);
  transform:translateY(-3px);
}
.lesson-tab:hover{border-color:var(--cyan);color:var(--cyan);}

.section-panel{display:none;flex:1;flex-direction:column;}
.section-panel.active{display:flex;animation:levelIn .4s ease;}

/* Explore Task immersive */
.explore-fullscreen{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:
    radial-gradient(circle at 30% 20%, rgba(0,229,255,.12), transparent 45%),
    radial-gradient(circle at 75% 80%, rgba(255,107,43,.12), transparent 45%),
    var(--navy);
  z-index:500;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:60px;overflow-y:auto;
}
.explore-fullscreen.active{display:flex;animation:levelIn .5s ease;}
.exit-fullscreen{
  position:absolute;top:34px;right:34px;
  background:var(--navy2);border:3px solid var(--orange);
  color:#fff;border-radius:14px;padding:16px 32px;font-size:24px;font-weight:700;
  cursor:pointer;min-height:60px;box-shadow:0 0 18px rgba(255,107,43,.4);
  transition:.2s;
}
.exit-fullscreen:hover{background:var(--orange);color:var(--navy);box-shadow:0 0 32px rgba(255,107,43,.8);}
.explore-text{
  font-size:56px;line-height:1.45;max-width:1500px;text-align:center;
  margin:34px 0;font-weight:700;font-family:'Rajdhani',sans-serif;
  text-shadow:0 0 22px rgba(255,255,255,.25);
}
.explore-visual{
  width:100%;max-width:920px;height:340px;
  background:linear-gradient(160deg,var(--navy2),#1c2750);
  border-radius:28px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;border:3px solid var(--cyan);
  box-shadow:0 0 40px rgba(0,229,255,.25);
}
.timer-row{display:flex;gap:24px;align-items:center;margin-top:16px;}
.timer-btn{
  background:linear-gradient(160deg,var(--navy2),#1c2750);border:3px solid var(--yellow);color:var(--yellow);
  border-radius:16px;padding:18px 34px;font-size:28px;font-weight:700;
  cursor:pointer;min-height:60px;transition:.2s;box-shadow:0 0 16px rgba(255,214,0,.3);
  font-family:'Rajdhani',sans-serif;
}
.timer-btn:hover{background:var(--yellow);color:var(--navy);box-shadow:0 0 34px rgba(255,214,0,.8);transform:translateY(-2px);}
.timer-display{font-size:54px;font-weight:800;color:var(--yellow);min-width:170px;text-align:center;font-family:'Orbitron',sans-serif;text-shadow:0 0 18px rgba(255,214,0,.6);}

/* Master steps */
.master-step{
  background:linear-gradient(160deg,var(--navy2),#1c2750);border-left:8px solid var(--cyan);
  border-radius:16px;padding:28px 34px;margin-bottom:22px;
  font-size:34px;font-weight:600;font-family:'Rajdhani',sans-serif;
  opacity:0;transform:translateX(50px);
}
.master-step.show{
  animation:stepGlow .65s ease forwards;
}
@keyframes stepGlow{
  0%{opacity:0;transform:translateX(50px);box-shadow:0 0 0 rgba(0,229,255,0);}
  55%{opacity:1;transform:translateX(0);box-shadow:0 0 50px rgba(0,229,255,.8);}
  100%{opacity:1;transform:translateX(0);box-shadow:0 0 16px rgba(0,229,255,.3);}
}
.tap-btn{
  background:linear-gradient(135deg,var(--orange),#ffb066);
  border:none;color:#0a0e1a;font-weight:800;font-size:30px;
  font-family:'Rajdhani',sans-serif;letter-spacing:.5px;
  border-radius:18px;padding:22px 48px;cursor:pointer;min-height:60px;
  box-shadow:0 8px 28px rgba(255,107,43,.5), 0 0 0 rgba(255,107,43,0);
  align-self:flex-start;margin-top:14px;transition:.18s;
  animation:btnPulse 2.6s ease-in-out infinite;
}
@keyframes btnPulse{
  0%,100%{box-shadow:0 8px 28px rgba(255,107,43,.4);}
  50%{box-shadow:0 8px 40px rgba(255,107,43,.85), 0 0 30px rgba(255,214,0,.4);}
}
.tap-btn:hover{transform:scale(1.07) translateY(-2px);}
.tap-btn:disabled{opacity:.35;cursor:default;transform:none;animation:none;}

/* Guided practice */
.progress-indicator{font-size:30px;color:var(--yellow);font-weight:700;margin-bottom:22px;text-shadow:0 0 14px rgba(255,214,0,.5);font-family:'Orbitron',sans-serif;}
.question-card{
  background:linear-gradient(160deg,var(--navy2),#1c2750);border:4px solid var(--orange);
  border-radius:24px;padding:40px;margin-bottom:28px;
  font-size:42px;font-weight:700;font-family:'Rajdhani',sans-serif;
  opacity:0;transform:translateX(140px);
  box-shadow:0 0 0 rgba(255,107,43,0);
}
.question-card.show{
  animation:neonSlide .6s cubic-bezier(.2,.8,.3,1.2) forwards;
}
@keyframes neonSlide{
  0%{opacity:0;transform:translateX(140px);box-shadow:0 0 0 rgba(255,107,43,0);}
  55%{opacity:1;transform:translateX(-14px);box-shadow:0 0 60px rgba(255,107,43,.9);}
  100%{opacity:1;transform:translateX(0);box-shadow:0 0 22px rgba(255,107,43,.4);}
}
.answer-box{
  margin-top:24px;background:#0d1326;border-radius:16px;
  padding:28px;font-size:36px;color:var(--cyan);font-weight:700;
  cursor:pointer;border:3px dashed #335;text-align:center;
  transition:.25s;opacity:0;transform:translateY(0);
  animation:fadeReady .3s ease forwards;
}
@keyframes fadeReady{ to{opacity:1;} }
.answer-box.revealed{
  animation:swoosh .55s cubic-bezier(.2,.8,.25,1.2) forwards;
  border:3px solid var(--cyan);cursor:default;
  box-shadow:0 0 38px rgba(0,229,255,.6);
}
@keyframes swoosh{
  0%{transform:translateY(60px) scale(.9);opacity:.2;box-shadow:0 0 0 rgba(0,229,255,0);}
  60%{transform:translateY(-8px) scale(1.03);opacity:1;box-shadow:0 0 50px rgba(0,229,255,.85);}
  100%{transform:translateY(0) scale(1);opacity:1;box-shadow:0 0 22px rgba(0,229,255,.5);}
}

/* Particle burst */
.particle{
  position:fixed;border-radius:50%;pointer-events:none;z-index:900;
}

/* Admin */
.gear-btn{
  position:fixed;bottom:18px;right:18px;
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.04);border:1px solid #334;
  color:#556;font-size:24px;cursor:pointer;z-index:600;
  display:flex;align-items:center;justify-content:center;
  transition:.3s;
}
.gear-btn:hover{
  color:var(--cyan);border-color:var(--cyan);
  box-shadow:0 0 22px rgba(0,229,255,.6);
  transform:rotate(90deg);
}

.modal-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:rgba(0,0,0,.7);z-index:700;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal{
  background:linear-gradient(165deg,#141b38,#1c2750);border-radius:28px;padding:44px;
  width:min(900px,92vw);max-height:88vh;overflow-y:auto;
  border:3px solid var(--cyan);
  box-shadow:0 0 80px rgba(0,229,255,.35), 0 30px 80px rgba(0,0,0,.6);
  animation:modalPop .35s cubic-bezier(.2,.8,.25,1.2);
}
@keyframes modalPop{
  from{opacity:0;transform:scale(.9) translateY(30px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
.modal h2{margin-bottom:24px;}
.modal label{display:block;font-size:22px;color:var(--cyan);margin:16px 0 8px;font-weight:700;letter-spacing:.5px;text-shadow:0 0 8px rgba(0,229,255,.35);}
.modal input,.modal select,.modal textarea{
  width:100%;background:#0a0f22;border:2px solid #2a3760;color:#fff;
  border-radius:12px;padding:16px;font-size:22px;font-family:'Rajdhani',sans-serif;font-weight:600;
  transition:.2s;
}
.modal input:focus,.modal select:focus,.modal textarea:focus{
  outline:none;border-color:var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.4);
}
.modal textarea{min-height:120px;resize:vertical;}
.modal-actions{display:flex;gap:18px;margin-top:30px;justify-content:flex-end;}
.btn{
  border:none;border-radius:14px;padding:18px 38px;font-size:22px;font-weight:800;
  cursor:pointer;min-height:60px;font-family:'Rajdhani',sans-serif;letter-spacing:.5px;
  transition:.2s;position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg);transition:.5s;
}
.btn:hover::after{left:140%;}
.btn-primary{background:linear-gradient(135deg,var(--orange),#ffb066);color:#0a0e1a;box-shadow:0 0 22px rgba(255,107,43,.5);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(255,107,43,.85);}
.btn-secondary{background:linear-gradient(135deg,#2a3760,#3a4a80);color:#fff;}
.btn-secondary:hover{transform:translateY(-2px);}
.btn-danger{background:linear-gradient(135deg,#ff3b3b,#ff7676);color:#fff;box-shadow:0 0 18px rgba(255,59,59,.4);}
.pin-display{font-size:54px;letter-spacing:22px;text-align:center;margin:24px 0;color:var(--yellow);font-family:'Orbitron',sans-serif;text-shadow:0 0 22px rgba(255,214,0,.6);}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.pin-keys button{
  font-size:30px;padding:22px;border-radius:16px;border:2px solid #2a3760;
  background:#0a0f22;color:#fff;cursor:pointer;min-height:60px;font-family:'Rajdhani',sans-serif;font-weight:700;
  transition:.15s;
}
.pin-keys button:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.5);transform:translateY(-2px);}

/* PDF upload zone */
.upload-zone{
  border:3px dashed var(--cyan);border-radius:20px;
  background:linear-gradient(160deg,rgba(0,229,255,.06),rgba(255,107,43,.04));
  padding:36px;text-align:center;cursor:pointer;margin:18px 0 26px;
  transition:.25s;position:relative;overflow:hidden;
}
.upload-zone:hover{
  border-color:var(--yellow);box-shadow:0 0 40px rgba(255,214,0,.35);
  transform:translateY(-2px);
}
.upload-zone .up-icon{font-size:64px;display:block;margin-bottom:10px;
  filter:drop-shadow(0 0 16px rgba(0,229,255,.6));
  animation:floatIcon 2.4s ease-in-out infinite;}
@keyframes floatIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.upload-zone .up-title{font-size:28px;font-weight:800;color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.5);}
.upload-zone .up-sub{font-size:20px;color:#9fb0d0;margin-top:6px;}
.upload-status{
  display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;margin:10px 0 4px;
  color:var(--yellow);min-height:30px;
}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:4px solid rgba(255,214,0,.25);border-top-color:var(--yellow);
  animation:spin .8s linear infinite;display:none;
}
.spinner.active{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.upload-status.success{color:var(--cyan);}
.upload-status.error{color:#ff6b6b;}
.divider-or{
  display:flex;align-items:center;gap:16px;color:#5a6a96;font-weight:700;font-size:20px;
  margin:8px 0 20px;letter-spacing:2px;
}
.divider-or::before,.divider-or::after{content:'';flex:1;height:2px;background:#2a3760;}

.admin-list-row{
  display:flex;justify-content:space-between;align-items:center;
  background:#0d1326;border-radius:12px;padding:16px 20px;margin-bottom:10px;
}
.admin-list-row .actions{display:flex;gap:10px;}
.icon-btn{
  background:#1a2240;border:1px solid #334;color:#fff;border-radius:8px;
  padding:8px 14px;font-size:18px;cursor:pointer;
}
.icon-btn:hover{border-color:var(--cyan);}

::-webkit-scrollbar{width:12px;}
::-webkit-scrollbar-thumb{background:#334;border-radius:6px;}
</style>
</head>
<body>
<div id="bg-mesh"></div>
<div id="bg-stars"></div>
<div id="app">

  <!-- LEVEL 1: Homepage -->
  <div class="screen active" id="screen-home">
    <h1>📚 MATHS QUEST — Years 7–8</h1>
    <p class="tagline">⚡ Tap a book to begin your lesson ⚡</p>
    <div class="grid" id="books-grid"></div>
  </div>

  <!-- LEVEL 2: Chapters -->
  <div class="screen" id="screen-chapters">
    <div class="breadcrumb" id="crumb-chapters"></div>
    <button class="back-btn" data-back="home">← Back</button>
    <h2 id="chapters-title"></h2>
    <div class="grid" id="chapters-grid"></div>
  </div>

  <!-- LEVEL 3: Lessons -->
  <div class="screen" id="screen-lessons">
    <div class="breadcrumb" id="crumb-lessons"></div>
    <button class="back-btn" data-back="chapters">← Back</button>
    <h2 id="lessons-title"></h2>
    <div class="grid" id="lessons-grid"></div>
  </div>

  <!-- LEVEL 4: Lesson view -->
  <div class="screen" id="screen-lesson">
    <div class="breadcrumb" id="crumb-lesson"></div>
    <button class="back-btn" data-back="lessons">← Back</button>
    <h2 id="lesson-title"></h2>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="lesson-progress-fill"></div></div>
    <div class="lesson-tabs">

<script>

            masterSteps:[
              'We line up the numbers by place value: thousands, hundreds, tens, ones.',

const BOOK_ICONS = ['📘','📗','📙','📕','📔','📓'];

/* ============================ RENDER: LESSON ============================ */
let masterStepIndex = 0;
let practiceIndex = 0;
let revealedAnswers = new Set();
let timerInterval = null;

function renderLesson(){
  const book = findBook(nav.bookId);
  const ch = findChapter(book, nav.chapterId);

function updateLessonProgress(){
  const active = document.querySelector('.lesson-tab.active');
  const tab = active ? active.dataset.tab : 'explore';

function setupExplore(lesson){
  document.getElementById('btn-launch-explore').onclick = ()=>{
    document.getElementById('explore-overlay-title').textContent = lesson.title;
    document.getElementById('explore-overlay-text').textContent = lesson.exploreText || '(No explore task text set)';
    renderManipulative(lesson.manipulative);
    document.getElementById('explore-overlay').classList.add('active');
    resetTimer();
  };
}

function renderManipulative(type){
  const v = document.getElementById('explore-visual');
  v.innerHTML = '';
  const c = document.createElement('canvas');
  c.width = 860; c.height = 320;
  c.style.maxWidth='100%'; c.style.maxHeight='100%';
  v.appendChild(c);
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#fff';

  if(type==='place value blocks'){
    // draw a few hundred/ten/one blocks
    const colors=['#ff6b2b','#ffd600','#00e5ff'];
    for(let i=0;i<3;i++){
      ctx.fillStyle=colors[i];
      ctx.fillRect(60+i*260, 60, 80,80*(3-i)/1.3);
      ctx.fillStyle='#fff';
      ctx.font='20px Poppins';
      ctx.fillText(['Hundreds','Tens','Ones'][i], 60+i*260, 220);
    }
  } else if(type==='number line'){
    ctx.strokeStyle='#00e5ff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(60,160); ctx.lineTo(800,160); ctx.stroke();
    for(let i=0;i<=10;i++){
      const x = 60+i*74;
      ctx.beginPath(); ctx.moveTo(x,150); ctx.lineTo(x,170); ctx.stroke();
      ctx.fillStyle='#9fb0d0'; ctx.font='16px Poppins';
      ctx.fillText(i, x-5, 195);
    }
    ctx.fillStyle='#ff6b2b';
    ctx.beginPath(); ctx.arc(60+3*74,160,10,0,7); ctx.fill();
  } else if(type==='array'){
    ctx.fillStyle='#ffd600';
    for(let r=0;r<4;r++) for(let cc=0;cc<6;cc++){
      ctx.beginPath(); ctx.arc(80+cc*60, 70+r*60, 18, 0, 7); ctx.fill();
    }
  } else if(type==='bar model'){
    ctx.fillStyle='#ff6b2b'; ctx.fillRect(80,90,360,70);
    ctx.fillStyle='#00e5ff'; ctx.fillRect(450,90,260,70);
    ctx.fillStyle='#0a0e1a'; ctx.font='bold 22px Poppins';
    ctx.fillText('Part A', 200, 132);
    ctx.fillText('Part B', 540, 132);
  } else {
    ctx.fillStyle='#9fb0d0'; ctx.font='24px Poppins';
    ctx.fillText('No manipulative for this task', 220, 165);
  }
}

let timerSecondsLeft = 0;
function resetTimer(){
  clearInterval(timerInterval); timerInterval=null;
  timerSecondsLeft = 0;
  document.getElementById('timer-display').textContent='--:--';
}
function startTimer(secs){
  clearInterval(timerInterval);
  timerSecondsLeft = secs;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timerSecondsLeft--;
    updateTimerDisplay();
    if(timerSecondsLeft<=0){
      clearInterval(timerInterval);
      document.getElementById('timer-display').style.color = 'var(--orange)';
      playChime();
    }
  },1000);
}
function updateTimerDisplay(){
  const m = Math.floor(timerSecondsLeft/60);
  const s = timerSecondsLeft%60;
  document.getElementById('timer-display').style.color='var(--yellow)';
  document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function setupMaster(lesson){
  const wrap = document.getElementById('master-steps');
  wrap.innerHTML='';
  (lesson.masterSteps||[]).forEach(()=>{
    const div = document.createElement('div');
    div.className='master-step';
    wrap.appendChild(div);
  });
  const btn = document.getElementById('btn-next-step');
  btn.disabled = (lesson.masterSteps||[]).length===0;
  btn.textContent = 'Show next step ▸';
  btn.onclick = ()=>{
    const steps = wrap.querySelectorAll('.master-step');
    if(masterStepIndex < steps.length){
      steps[masterStepIndex].textContent = lesson.masterSteps[masterStepIndex];
      steps[masterStepIndex].classList.add('show');
      masterStepIndex++;
      if(masterStepIndex>=steps.length){
        btn.disabled = true;
        btn.textContent = 'All steps shown ✓';
        burstParticles(btn);
      }
    }
  };
}

function setupPractice(lesson){
  const list = document.getElementById('practice-list');
  list.innerHTML='';
  const total = (lesson.practiceQ||[]).length;
  updatePracticeProgress(0, total);
  const btn = document.getElementById('btn-next-question');
  btn.disabled = total===0;
  btn.textContent = 'Reveal next question ▸';

  btn.onclick = ()=>{
    if(practiceIndex < total){
      const card = document.createElement('div');
      card.className='question-card';
      card.innerHTML = `<div>Q${practiceIndex+1}. ${lesson.practiceQ[practiceIndex]}</div>
        <div class="answer-box" data-idx="${practiceIndex}">Tap to reveal answer</div>`;
      list.appendChild(card);
      requestAnimationFrame(()=>card.classList.add('show'));

      const ansBox = card.querySelector('.answer-box');
      ansBox.onclick = ()=>{
        if(revealedAnswers.has(practiceIndex)) return;
        revealedAnswers.add(practiceIndex);
        ansBox.textContent = `✓ ${lesson.practiceA[ansBox.dataset.idx] ?? '(no answer set)'}`;
        ansBox.classList.add('revealed');
        playChime();
      };

      practiceIndex++;
      updatePracticeProgress(practiceIndex, total);
      if(practiceIndex>=total){
        btn.disabled = true;
        btn.textContent = 'All questions revealed ✓';
        burstParticles(btn);
        document.getElementById('lesson-progress-fill').style.width = '100%';
      }
    }
  };
}
function updatePracticeProgress(curr,total){
  document.getElementById('practice-progress').textContent =
    total===0 ? 'No guided practice questions set' : `Question ${Math.min(curr,total)} of ${total} revealed`;
}

/* ============================ AUDIO (chime) ============================ */
// Generate a short pleasant chime using Web Audio API (no external file needed)
let audioCtx = null;
function playChime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [880, 1320].forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02 + i*0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6 + i*0.05);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i*0.05);
      osc.stop(now + 0.7 + i*0.05);
    });
  }catch(e){}
}

/* ============================ PARTICLE BURST ============================ */
function burstParticles(originEl){
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ['#ff6b2b','#ffd600','#00e5ff','#ffffff'];
  for(let i=0;i<24;i++){
    const p = document.createElement('div');
    p.className='particle';
    const size = 6+Math.random()*8;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = cx+'px';
    p.style.top = cy+'px';
    p.style.background = colors[i%colors.length];
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2;
    const dist = 80+Math.random()*160;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    p.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px, ${dy}px) scale(0)`, opacity:0 }
    ], { duration: 700+Math.random()*400, easing:'cubic-bezier(.2,.7,.3,1)' });
    setTimeout(()=>p.remove(), 1200);
  }
}

buildPinKeys();
function updatePinDisplay(){
  const d = pinBuffer.padEnd(4,'‒').split('').join(' ');
  document.getElementById('pin-display').textContent = d;
}
function pinPress(digit){
  if(pinBuffer.length>=4) return;
  pinBuffer += digit;
  updatePinDisplay();
  if(pinBuffer.length===4){
    setTimeout(()=>{
      if(pinBuffer===getPin()){
        document.getElementById('pin-overlay').classList.remove('active');
        pinBuffer='';
        updatePinDisplay();
        openAdminPanel();
      } else {
        document.getElementById('pin-display').style.color = '#ff3b3b';
        setTimeout(()=>{
          document.getElementById('pin-display').style.color='var(--yellow)';
          pinBuffer='';
          updatePinDisplay();
        },500);
      }
    },150);
  }
}

  addBookBtn.onclick = openAddBookForm;
  body.appendChild(addBookBtn);

  DATA.books.forEach(book=>{
    const bSection = document.createElement('div');
    bSection.style.cssText='border:1px solid #334;border-radius:14px;padding:16px;margin-bottom:18px;';
    bSection.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="font-size:26px;color:var(--cyan);">📘 Book ${escapeHtml(book.name)}</h3>
        <div class="actions"></div>
      </div>`;
    const actions = bSection.querySelector('.actions');
    const addChBtn = document.createElement('button');
    addChBtn.className='icon-btn'; addChBtn.textContent='+ Chapter';
    addChBtn.onclick = ()=> openAddChapterForm(book);
    const delBookBtn = document.createElement('button');
    delBookBtn.className='icon-btn'; delBookBtn.textContent='Delete book';
    delBookBtn.onclick = ()=> { if(confirm(`Delete Book ${book.name} and all its content?`)){ DATA.books = DATA.books.filter(b=>b.id!==book.id); saveData(DATA); renderAdminBody(); renderHome(); } };
    actions.append(addChBtn, delBookBtn);

    book.chapters.forEach(ch=>{
      const chRow = document.createElement('div');
      chRow.style.cssText='margin:12px 0 0 20px;border-left:3px solid var(--orange);padding-left:14px;';
      chRow.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font-size:22px;">📂 ${escapeHtml(ch.name)}</strong>
          <div class="actions"></div>
        </div>`;
      const chActions = chRow.querySelector('.actions');
      const addLBtn = document.createElement('button');
      addLBtn.className='icon-btn'; addLBtn.textContent='+ Lesson';
      addLBtn.onclick = ()=> openLessonForm(book, ch, null);
      const delChBtn = document.createElement('button');
      delChBtn.className='icon-btn'; delChBtn.textContent='Delete chapter';
      delChBtn.onclick = ()=>{ if(confirm(`Delete "${ch.name}"?`)){ book.chapters = book.chapters.filter(c=>c.id!==ch.id); saveData(DATA); renderAdminBody(); } };
      chActions.append(addLBtn, delChBtn);

      ch.lessons.forEach((l, idx)=>{
        const row = document.createElement('div');
        row.className='admin-list-row';
        row.style.marginTop='10px';
        row.innerHTML = `<div>📝 Lesson ${l.number}: ${escapeHtml(l.title)}</div><div class="actions"></div>`;
        const a = row.querySelector('.actions');
        if(idx>0){
          const up = document.createElement('button'); up.className='icon-btn'; up.textContent='↑';
          up.onclick = ()=>{ [ch.lessons[idx-1],ch.lessons[idx]]=[ch.lessons[idx],ch.lessons[idx-1]]; saveData(DATA); renderAdminBody(); };
          a.appendChild(up);
        }
        if(idx<ch.lessons.length-1){
          const down = document.createElement('button'); down.className='icon-btn'; down.textContent='↓';
          down.onclick = ()=>{ [ch.lessons[idx+1],ch.lessons[idx]]=[ch.lessons[idx],ch.lessons[idx+1]]; saveData(DATA); renderAdminBody(); };
          a.appendChild(down);
        }
        const editBtn = document.createElement('button'); editBtn.className='icon-btn'; editBtn.textContent='Edit';
        editBtn.onclick = ()=> openLessonForm(book, ch, l);
        const delBtn = document.createElement('button'); delBtn.className='icon-btn'; delBtn.textContent='Delete';
        delBtn.onclick = ()=>{ if(confirm(`Delete lesson "${l.title}"?`)){ ch.lessons = ch.lessons.filter(x=>x.id!==l.id); saveData(DATA); renderAdminBody(); } };
        a.append(editBtn, delBtn);
        chRow.appendChild(row);
      });
      bSection.appendChild(chRow);
    });
    body.appendChild(bSection);
  });
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML;
}

/* ============================ PDF AUTO-FILL ============================ */
let pdfJsLoadPromise = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = ()=> reject(new Error('Could not load PDF reader (no internet connection?)'));
    document.head.appendChild(s);
  });
  return pdfJsLoadPromise;
}

async function extractPdfText(file){
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lastY = null, line = '';
    content.items.forEach(item=>{
      if(lastY!==null && Math.abs(item.transform[5]-lastY) > 4){
        fullText += line.trim() + '\n';
        line = '';
      }
      line += item.str + ' ';
      lastY = item.transform[5];
    });
    fullText += line.trim() + '\n\n';
  }
  return fullText;
}

// Heuristic parsing of MNP-style lesson text into structured fields
function parseLessonFromText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const result = { title:'', exploreText:'', masterSteps:[], practiceQ:[], practiceA:[] };

  const SECTION_PATTERNS = {
    explore: /^(explore|explore\s*task|let'?s\s*explore)/i,
    master:  /^(master|let'?s\s*learn|learn|worked\s*example)/i,
    practice:/^(guided\s*practice|practice|questions?)/i,
    answers: /^(answers?|solutions?)/i
  };

  let section = null;
  const buckets = { explore:[], master:[], practice:[], answers:[] };

  // Try to find a title from the first short heading-like line
  for(const l of lines.slice(0,6)){
    if(l.length < 80 && !SECTION_PATTERNS.explore.test(l) && /[a-zA-Z]/.test(l)){
      result.title = l.replace(/^lesson\s*\d+[:.\-]?\s*/i,'').trim();
      break;
    }
  }

  lines.forEach(line=>{
    if(SECTION_PATTERNS.answers.test(line)){ section='answers'; return; }
    if(SECTION_PATTERNS.practice.test(line)){ section='practice'; return; }
    if(SECTION_PATTERNS.master.test(line)){ section='master'; return; }
    if(SECTION_PATTERNS.explore.test(line)){ section='explore'; return; }
    if(section) buckets[section].push(line);
  });

  result.exploreText = buckets.explore.join(' ').trim();
  result.masterSteps = buckets.master.filter(l=>l.length>1);

  // Practice: split into Q/A pairs — lines starting with a number or "Q"
  const qLines = buckets.practice.filter(l=>l.length>1);
  const qaSplit = qLines.length ? qLines : [];
  result.practiceQ = qaSplit.filter(l=>/^(q\.?\s*\d+|\d+[\).:]|question)/i.test(l)) ;
  if(result.practiceQ.length===0) result.practiceQ = qaSplit;

  result.practiceA = buckets.answers.filter(l=>l.length>0)
    .filter(l=>/^(a\.?\s*\d+|\d+[\).:]|answer)/i.test(l) || buckets.answers.length);

  // Clean leading numbering like "1." or "Q1:" from each
  const stripNum = s => s.replace(/^(q\.?\s*\d+[:.\-]?|a\.?\s*\d+[:.\-]?|\d+[\).:]|question\s*\d*[:.\-]?|answer\s*\d*[:.\-]?)\s*/i,'').trim();
  result.practiceQ = result.practiceQ.map(stripNum).filter(s=>s.length>0);
  result.practiceA = result.practiceA.map(stripNum).filter(s=>s.length>0);

  return result;
}

function setUploadStatus(el, msg, mode){
  el.className = 'upload-status' + (mode ? ' '+mode : '');
  const spinner = el.querySelector('.spinner');
  el.innerHTML = (mode==='loading' ? '<div class="spinner active"></div>' : '') + `<span>${msg}</span>`;
}

function openLessonForm(book, chapter, lesson){
  const isEdit = !!lesson;
  const l = lesson || { number: chapter.lessons.length+1, title:'', exploreText:'', manipulative:'none', masterSteps:[], practiceQ:[], practiceA:[] };
  openForm(isEdit ? `Edit Lesson` : `Add Lesson to ${chapter.name}`, `
    <div class="upload-zone" id="pdf-drop">
      <span class="up-icon">📄✨</span>
      <div class="up-title">Upload a PDF — auto-fill this lesson</div>
      <div class="up-sub">Tap to choose a Maths No Problem PDF page. We'll read it and fill in the fields below for you to check.</div>
      <input type="file" id="pdf-input" accept="application/pdf" style="display:none;">
    </div>
    <div class="upload-status" id="pdf-status"></div>
    <div class="divider-or">OR FILL IN MANUALLY / EDIT BELOW</div>
    <label>Lesson number</label>
    <input id="f-l-number" type="number" min="1" value="${l.number}">
    <label>Lesson title</label>
    <input id="f-l-title" type="text" value="${escapeHtml(l.title)}" placeholder="Adding Whole Numbers">
    <label>Explore Task text (exact MNP wording)</label>
    <textarea id="f-l-explore">${escapeHtml(l.exploreText)}</textarea>
    <label>Explore Task manipulative</label>
    <select id="f-l-manip">
      ${['none','place value blocks','number line','array','bar model'].map(m=>
        `<option value="${m}" ${l.manipulative===m?'selected':''}>${m}</option>`).join('')}
    </select>
    <label>Master content — one step per line</label>
    <textarea id="f-l-master">${escapeHtml((l.masterSteps||[]).join('\n'))}</textarea>
    <label>Guided Practice questions — one per line</label>
    <textarea id="f-l-pq">${escapeHtml((l.practiceQ||[]).join('\n'))}</textarea>
    <label>Guided Practice answers — one per line (matching order)</label>
    <textarea id="f-l-pa">${escapeHtml((l.practiceA||[]).join('\n'))}</textarea>
  `, ()=>{
    const number = parseInt(document.getElementById('f-l-number').value,10) || 1;
    const title = document.getElementById('f-l-title').value.trim();
    if(!title){ alert('Please enter a lesson title.'); return false; }
    const exploreText = document.getElementById('f-l-explore').value.trim();
    const manipulative = document.getElementById('f-l-manip').value;
    const splitLines = s => s.split('\n').map(x=>x.trim()).filter(x=>x.length>0);
    const masterSteps = splitLines(document.getElementById('f-l-master').value);
    const practiceQ = splitLines(document.getElementById('f-l-pq').value);
    const practiceA = splitLines(document.getElementById('f-l-pa').value);

    if(isEdit){
      Object.assign(lesson, { number, title, exploreText, manipulative, masterSteps, practiceQ, practiceA });
    } else {
      chapter.lessons.push({ id:uid(), number, title, exploreText, manipulative, masterSteps, practiceQ, practiceA });
    }
    saveData(DATA);
    renderAdminBody();
  });

  // Wire up PDF upload zone
  const dropZone = document.getElementById('pdf-drop');
  const fileInput = document.getElementById('pdf-input');
  const statusEl = document.getElementById('pdf-status');
  dropZone.onclick = ()=> fileInput.click();
  fileInput.onchange = async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    setUploadStatus(statusEl, `Reading "${file.name}"…`, 'loading');
    try{
      const text = await extractPdfText(file);
      setUploadStatus(statusEl, 'Analysing lesson content…', 'loading');
      const parsed = parseLessonFromText(text);
      if(parsed.title) document.getElementById('f-l-title').value = parsed.title;
      if(parsed.exploreText) document.getElementById('f-l-explore').value = parsed.exploreText;
      if(parsed.masterSteps.length) document.getElementById('f-l-master').value = parsed.masterSteps.join('\n');
      if(parsed.practiceQ.length) document.getElementById('f-l-pq').value = parsed.practiceQ.join('\n');
      if(parsed.practiceA.length) document.getElementById('f-l-pa').value = parsed.practiceA.join('\n');
      setUploadStatus(statusEl, '✓ Filled in! Please check each field below before saving.', 'success');
      burstParticles(dropZone);
    }catch(err){
      setUploadStatus(statusEl, '✗ ' + (err.message || 'Could not read this PDF — please fill in manually.'), 'error');
    }
  };
}
