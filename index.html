<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Maths Teaching Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a0e1a;
  --navy2:#121830;
  --orange:#ff6b2b;
  --yellow:#ffd600;
  --cyan:#00e5ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;
  background:var(--navy);
  color:#fff;
  font-family:'Poppins',sans-serif;
  font-size:24px;
  overflow:hidden;
}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;}

/* Screens */
.screen{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:none;flex-direction:column;
  padding:30px 50px;
  overflow-y:auto;
}
.screen.active{display:flex;}
.screen.enter{animation:slideIn .4s ease forwards;}
@keyframes slideIn{
  from{opacity:0;transform:translateX(60px);}
  to{opacity:1;transform:translateX(0);}
}

/* Breadcrumb */
.breadcrumb{
  display:flex;align-items:center;gap:10px;
  font-size:22px;color:var(--cyan);margin-bottom:20px;flex-wrap:wrap;
}
.breadcrumb span{cursor:pointer;}
.breadcrumb span:hover{text-decoration:underline;}
.breadcrumb .sep{color:#556;}

.back-btn{
  background:var(--navy2);
  border:2px solid var(--cyan);
  color:#fff;
  border-radius:12px;
  padding:14px 28px;
  font-size:22px;
  font-weight:600;
  cursor:pointer;
  min-height:60px;
  margin-bottom:20px;
  align-self:flex-start;
  transition:.2s;
}
.back-btn:hover{background:var(--cyan);color:var(--navy);}

h1{font-size:52px;font-weight:800;margin-bottom:10px;}
h2{font-size:40px;font-weight:700;margin-bottom:20px;color:var(--yellow);}

/* Card grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:30px;
  margin-top:20px;
}
.card{
  background:linear-gradient(145deg,var(--navy2),#1a2240);
  border:3px solid transparent;
  border-radius:20px;
  padding:30px;
  min-height:140px;
  display:flex;flex-direction:column;justify-content:center;
  cursor:pointer;
  transition:.2s;
  font-size:28px;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.card:hover{
  transform:translateY(-6px) scale(1.03);
  border-color:var(--cyan);
  box-shadow:0 0 30px rgba(0,229,255,.5);
}
.card .sub{font-size:20px;font-weight:400;color:#9fb0d0;margin-top:8px;}
.card.add{
  border:3px dashed var(--orange);
  background:transparent;
  align-items:center;text-align:center;color:var(--orange);
}

/* Lesson view sections */
.lesson-tabs{display:flex;gap:20px;margin-bottom:20px;}
.lesson-tab{
  background:var(--navy2);border:2px solid #334;
  border-radius:14px;padding:16px 32px;font-size:24px;font-weight:700;
  cursor:pointer;min-height:60px;transition:.2s;
}
.lesson-tab.active{border-color:var(--orange);color:var(--orange);box-shadow:0 0 20px rgba(255,107,43,.4);}
.lesson-tab:hover{border-color:var(--cyan);}

.section-panel{display:none;flex:1;flex-direction:column;}
.section-panel.active{display:flex;animation:slideIn .35s ease;}

/* Explore Task immersive */
.explore-fullscreen{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:var(--navy);z-index:500;
  display:none;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:50px;overflow-y:auto;
}
.explore-fullscreen.active{display:flex;}
.exit-fullscreen{
  position:absolute;top:30px;right:30px;
  background:var(--navy2);border:2px solid var(--orange);
  color:#fff;border-radius:12px;padding:14px 28px;font-size:22px;
  cursor:pointer;min-height:60px;
}
.explore-text{
  font-size:36px;line-height:1.5;max-width:1400px;text-align:center;
  margin:30px 0;font-weight:600;
}
.explore-visual{
  width:100%;max-width:900px;height:340px;
  background:var(--navy2);border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:30px;border:2px solid #334;
}
.timer-row{display:flex;gap:20px;align-items:center;margin-top:10px;}
.timer-btn{
  background:var(--navy2);border:2px solid var(--yellow);color:var(--yellow);
  border-radius:14px;padding:16px 30px;font-size:24px;font-weight:700;
  cursor:pointer;min-height:60px;
}
.timer-btn:hover{background:var(--yellow);color:var(--navy);}
.timer-display{font-size:48px;font-weight:800;color:var(--yellow);min-width:160px;text-align:center;}

/* Master steps */
.master-step{
  background:var(--navy2);border-left:6px solid var(--cyan);
  border-radius:14px;padding:24px 30px;margin-bottom:20px;
  font-size:30px;font-weight:600;
  opacity:0;transform:translateX(40px);
}
.master-step.show{
  animation:stepGlow .6s ease forwards;
}
@keyframes stepGlow{
  0%{opacity:0;transform:translateX(40px);box-shadow:0 0 0 rgba(0,229,255,0);}
  60%{opacity:1;transform:translateX(0);box-shadow:0 0 40px rgba(0,229,255,.7);}
  100%{opacity:1;transform:translateX(0);box-shadow:0 0 12px rgba(0,229,255,.25);}
}
.tap-btn{
  background:linear-gradient(135deg,var(--orange),#ff944d);
  border:none;color:#0a0e1a;font-weight:800;font-size:26px;
  border-radius:16px;padding:18px 40px;cursor:pointer;min-height:60px;
  box-shadow:0 6px 20px rgba(255,107,43,.4);
  align-self:flex-start;margin-top:10px;transition:.15s;
}
.tap-btn:hover{transform:scale(1.05);}
.tap-btn:disabled{opacity:.35;cursor:default;transform:none;}

/* Guided practice */
.progress-indicator{font-size:26px;color:var(--yellow);font-weight:700;margin-bottom:20px;}
.question-card{
  background:var(--navy2);border:3px solid var(--orange);
  border-radius:20px;padding:36px;margin-bottom:24px;
  font-size:36px;font-weight:700;
  opacity:0;transform:translateX(120px);
  box-shadow:0 0 0 rgba(255,107,43,0);
}
.question-card.show{
  animation:neonSlide .55s cubic-bezier(.2,.8,.3,1.2) forwards;
}
@keyframes neonSlide{
  0%{opacity:0;transform:translateX(120px);box-shadow:0 0 0 rgba(255,107,43,0);}
  60%{opacity:1;transform:translateX(-10px);box-shadow:0 0 50px rgba(255,107,43,.8);}
  100%{opacity:1;transform:translateX(0);box-shadow:0 0 18px rgba(255,107,43,.35);}
}
.answer-box{
  margin-top:20px;background:#0d1326;border-radius:14px;
  padding:24px;font-size:32px;color:var(--cyan);font-weight:700;
  cursor:pointer;border:2px dashed #335;text-align:center;
  transition:.25s;
}
.answer-box.revealed{
  animation:swoosh .5s ease forwards;
  border:2px solid var(--cyan);cursor:default;
  box-shadow:0 0 25px rgba(0,229,255,.5);
}
@keyframes swoosh{
  0%{transform:scale(.9) translateY(-12px);opacity:.3;}
  100%{transform:scale(1) translateY(0);opacity:1;}
}

/* Particle burst */
.particle{
  position:fixed;border-radius:50%;pointer-events:none;z-index:900;
}

/* Admin */
.gear-btn{
  position:fixed;bottom:18px;right:18px;
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.05);border:1px solid #334;
  color:#667;font-size:24px;cursor:pointer;z-index:600;
  display:flex;align-items:center;justify-content:center;
}
.gear-btn:hover{color:var(--cyan);border-color:var(--cyan);}

.modal-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:rgba(0,0,0,.7);z-index:700;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--navy2);border-radius:24px;padding:40px;
  width:min(900px,92vw);max-height:88vh;overflow-y:auto;
  border:2px solid #334;
}
.modal h2{margin-bottom:24px;}
.modal label{display:block;font-size:20px;color:#9fb0d0;margin:14px 0 6px;}
.modal input,.modal select,.modal textarea{
  width:100%;background:#0d1326;border:2px solid #334;color:#fff;
  border-radius:10px;padding:14px;font-size:20px;font-family:inherit;
}
.modal textarea{min-height:120px;resize:vertical;}
.modal-actions{display:flex;gap:16px;margin-top:26px;justify-content:flex-end;}
.btn{
  border:none;border-radius:12px;padding:16px 32px;font-size:20px;font-weight:700;
  cursor:pointer;min-height:60px;
}
.btn-primary{background:var(--orange);color:#0a0e1a;}
.btn-secondary{background:#334;color:#fff;}
.btn-danger{background:#ff3b3b;color:#fff;}
.pin-display{font-size:48px;letter-spacing:20px;text-align:center;margin:20px 0;color:var(--yellow);}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.pin-keys button{
  font-size:28px;padding:20px;border-radius:14px;border:2px solid #334;
  background:#0d1326;color:#fff;cursor:pointer;min-height:60px;
}
.pin-keys button:hover{border-color:var(--cyan);}

.admin-list-row{
  display:flex;justify-content:space-between;align-items:center;
  background:#0d1326;border-radius:12px;padding:16px 20px;margin-bottom:10px;
}
.admin-list-row .actions{display:flex;gap:10px;}
.icon-btn{
  background:#1a2240;border:1px solid #334;color:#fff;border-radius:8px;
  padding:8px 14px;font-size:18px;cursor:pointer;
}
.icon-btn:hover{border-color:var(--cyan);}

::-webkit-scrollbar{width:12px;}
::-webkit-scrollbar-thumb{background:#334;border-radius:6px;}
</style>
</head>
<body>
<div id="app">

  <!-- LEVEL 1: Homepage -->
  <div class="screen active" id="screen-home">
    <h1>📚 Maths No Problem — Years 7–8</h1>
    <p style="color:#9fb0d0;font-size:24px;">Tap a book to begin</p>
    <div class="grid" id="books-grid"></div>
  </div>

  <!-- LEVEL 2: Chapters -->
  <div class="screen" id="screen-chapters">
    <div class="breadcrumb" id="crumb-chapters"></div>
    <button class="back-btn" data-back="home">← Back</button>
    <h2 id="chapters-title"></h2>
    <div class="grid" id="chapters-grid"></div>
  </div>

  <!-- LEVEL 3: Lessons -->
  <div class="screen" id="screen-lessons">
    <div class="breadcrumb" id="crumb-lessons"></div>
    <button class="back-btn" data-back="chapters">← Back</button>
    <h2 id="lessons-title"></h2>
    <div class="grid" id="lessons-grid"></div>
  </div>

  <!-- LEVEL 4: Lesson view -->
  <div class="screen" id="screen-lesson">
    <div class="breadcrumb" id="crumb-lesson"></div>
    <button class="back-btn" data-back="lessons">← Back</button>
    <h2 id="lesson-title"></h2>
    <div class="lesson-tabs">
      <div class="lesson-tab active" data-tab="explore">1. Explore Task</div>
      <div class="lesson-tab" data-tab="master">2. Master</div>
      <div class="lesson-tab" data-tab="practice">3. Guided Practice</div>
    </div>

    <div class="section-panel active" id="panel-explore">
      <button class="tap-btn" id="btn-launch-explore">🔍 Launch Explore Task (Full Screen)</button>
    </div>

    <div class="section-panel" id="panel-master">
      <div id="master-steps"></div>
      <button class="tap-btn" id="btn-next-step">Show next step ▸</button>
    </div>

    <div class="section-panel" id="panel-practice">
      <div class="progress-indicator" id="practice-progress"></div>
      <div id="practice-list"></div>
      <button class="tap-btn" id="btn-next-question">Reveal next question ▸</button>
    </div>
  </div>

  <!-- Explore fullscreen overlay -->
  <div class="explore-fullscreen" id="explore-overlay">
    <button class="exit-fullscreen" id="btn-exit-explore">✕ Exit full screen</button>
    <h2 id="explore-overlay-title" style="margin-top:10px;"></h2>
    <div class="explore-visual" id="explore-visual"></div>
    <div class="explore-text" id="explore-overlay-text"></div>
    <div class="timer-row">
      <button class="timer-btn" data-secs="60">⏱ 1 min</button>
      <button class="timer-btn" data-secs="120">⏱ 2 min</button>
      <button class="timer-btn" data-secs="300">⏱ 5 min</button>
      <div class="timer-display" id="timer-display">--:--</div>
    </div>
  </div>

  <!-- Gear / admin access -->
  <button class="gear-btn" id="gear-btn" title="Admin">⚙</button>

  <!-- PIN modal -->
  <div class="modal-overlay" id="pin-overlay">
    <div class="modal" style="width:420px;text-align:center;">
      <h2>Admin PIN</h2>
      <div class="pin-display" id="pin-display">‒ ‒ ‒ ‒</div>
      <div class="pin-keys" id="pin-keys"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="pin-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Admin panel modal -->
  <div class="modal-overlay" id="admin-overlay">
    <div class="modal" style="width:min(1100px,94vw);">
      <h2>Admin Panel</h2>
      <div id="admin-body"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="admin-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Generic form modal -->
  <div class="modal-overlay" id="form-overlay">
    <div class="modal">
      <h2 id="form-title"></h2>
      <div id="form-body"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="form-cancel">Cancel</button>
        <button class="btn btn-primary" id="form-save">Save</button>
      </div>
    </div>
  </div>

</div>

<audio id="chime-audio" preload="auto"></audio>

<script>
/* ============================ DATA LAYER ============================ */
const STORAGE_KEY = 'mnp_data_v1';
const PIN_KEY = 'mnp_pin_v1';

function defaultData(){
  return {
    books: [
      { id:'b1', name:'3A', chapters:[] },
      { id:'b2', name:'3B', chapters:[
        { id:'c1', name:'Chapter 2: Four Operations', lessons:[
          { id:'l1', number:1, title:'Adding Whole Numbers',
            exploreText:'Mrs Lim has 2,348 stickers. She buys another 1,576 stickers. How many stickers does she have altogether?',
            manipulative:'place value blocks',
            masterSteps:[
              'We line up the numbers by place value: thousands, hundreds, tens, ones.',
              '2,348 + 1,576 — start by adding the ones: 8 + 6 = 14. Write 4, carry 1.',
              'Add the tens: 4 + 7 + 1 (carried) = 12. Write 2, carry 1.',
              'Add the hundreds: 3 + 5 + 1 (carried) = 9.',
              'Add the thousands: 2 + 1 = 3.',
              'So 2,348 + 1,576 = 3,924 stickers altogether.'
            ],
            practiceQ:[
              '1,234 + 4,567 = ?',
              '3,809 + 2,456 = ?',
              '5,678 + 1,999 = ?',
              '4,321 + 3,789 = ?',
              '6,045 + 2,978 = ?'
            ],
            practiceA:[
              '5,801',
              '6,265',
              '7,677',
              '8,110',
              '9,023'
            ]
          }
        ]}
      ]}
    ]
  };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const d = defaultData();
  saveData(d);
  return d;
}
function saveData(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function getPin(){ return localStorage.getItem(PIN_KEY) || '1234'; }
function setPin(p){ localStorage.setItem(PIN_KEY, p); }

let DATA = loadData();
function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }

/* ============================ NAV STATE ============================ */
let nav = { bookId:null, chapterId:null, lessonId:null };

function findBook(id){ return DATA.books.find(b=>b.id===id); }
function findChapter(book,id){ return book.chapters.find(c=>c.id===id); }
function findLesson(chapter,id){ return chapter.lessons.find(l=>l.id===id); }

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active','enter');
  });
  const s = document.getElementById(id);
  s.classList.add('active');
  void s.offsetWidth;
  s.classList.add('enter');
}

/* ============================ RENDER: HOME ============================ */
function renderHome(){
  const grid = document.getElementById('books-grid');
  grid.innerHTML = '';
  DATA.books.forEach(book=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<div>📘 Book ${book.name}</div><div class="sub">${book.chapters.length} chapter(s)</div>`;
    card.onclick = ()=>{ nav.bookId=book.id; nav.chapterId=null; nav.lessonId=null; renderChapters(); showScreen('screen-chapters'); };
    grid.appendChild(card);
  });
}

/* ============================ RENDER: CHAPTERS ============================ */
function renderChapters(){
  const book = findBook(nav.bookId);
  document.getElementById('chapters-title').textContent = `Book ${book.name} — Chapters`;
  document.getElementById('crumb-chapters').innerHTML =
    `<span data-nav="home">🏠 Home</span><span class="sep">›</span><span>Book ${book.name}</span>`;
  const grid = document.getElementById('chapters-grid');
  grid.innerHTML = '';
  if(book.chapters.length===0){
    grid.innerHTML = `<div style="color:#9fb0d0;font-size:24px;">No chapters yet. Add some via the admin panel (gear icon, bottom right).</div>`;
  }
  book.chapters.forEach(ch=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<div>📂 ${ch.name}</div><div class="sub">${ch.lessons.length} lesson(s)</div>`;
    card.onclick = ()=>{ nav.chapterId=ch.id; nav.lessonId=null; renderLessons(); showScreen('screen-lessons'); };
    grid.appendChild(card);
  });
  bindCrumbNav('crumb-chapters');
}

/* ============================ RENDER: LESSONS ============================ */
function renderLessons(){
  const book = findBook(nav.bookId);
  const ch = findChapter(book, nav.chapterId);
  document.getElementById('lessons-title').textContent = `${ch.name} — Lessons`;
  document.getElementById('crumb-lessons').innerHTML =
    `<span data-nav="home">🏠 Home</span><span class="sep">›</span>`+
    `<span data-nav="chapters">Book ${book.name}</span><span class="sep">›</span>`+
    `<span>${ch.name}</span>`;
  const grid = document.getElementById('lessons-grid');
  grid.innerHTML = '';
  if(ch.lessons.length===0){
    grid.innerHTML = `<div style="color:#9fb0d0;font-size:24px;">No lessons yet. Add one via the admin panel.</div>`;
  }
  ch.lessons.forEach(l=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<div>📝 Lesson ${l.number}</div><div class="sub">${l.title}</div>`;
    card.onclick = ()=>{ nav.lessonId=l.id; renderLesson(); showScreen('screen-lesson'); };
    grid.appendChild(card);
  });
  bindCrumbNav('crumb-lessons');
}

/* ============================ RENDER: LESSON ============================ */
let masterStepIndex = 0;
let practiceIndex = 0;
let revealedAnswers = new Set();
let timerInterval = null;

function renderLesson(){
  const book = findBook(nav.bookId);
  const ch = findChapter(book, nav.chapterId);
  const lesson = findLesson(ch, nav.lessonId);

  document.getElementById('lesson-title').textContent = `Lesson ${lesson.number}: ${lesson.title}`;
  document.getElementById('crumb-lesson').innerHTML =
    `<span data-nav="home">🏠 Home</span><span class="sep">›</span>`+
    `<span data-nav="chapters">Book ${book.name}</span><span class="sep">›</span>`+
    `<span data-nav="lessons">${ch.name}</span><span class="sep">›</span>`+
    `<span>Lesson ${lesson.number}</span>`;
  bindCrumbNav('crumb-lesson');

  // Reset state
  masterStepIndex = 0;
  practiceIndex = 0;
  revealedAnswers = new Set();

  // Tabs default to Explore
  document.querySelectorAll('.lesson-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.lesson-tab[data-tab="explore"]').classList.add('active');
  document.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-explore').classList.add('active');

  setupExplore(lesson);
  setupMaster(lesson);
  setupPractice(lesson);
}

function setupExplore(lesson){
  document.getElementById('btn-launch-explore').onclick = ()=>{
    document.getElementById('explore-overlay-title').textContent = lesson.title;
    document.getElementById('explore-overlay-text').textContent = lesson.exploreText || '(No explore task text set)';
    renderManipulative(lesson.manipulative);
    document.getElementById('explore-overlay').classList.add('active');
    resetTimer();
  };
}

function renderManipulative(type){
  const v = document.getElementById('explore-visual');
  v.innerHTML = '';
  const c = document.createElement('canvas');
  c.width = 860; c.height = 320;
  c.style.maxWidth='100%'; c.style.maxHeight='100%';
  v.appendChild(c);
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#fff';

  if(type==='place value blocks'){
    // draw a few hundred/ten/one blocks
    const colors=['#ff6b2b','#ffd600','#00e5ff'];
    for(let i=0;i<3;i++){
      ctx.fillStyle=colors[i];
      ctx.fillRect(60+i*260, 60, 80,80*(3-i)/1.3);
      ctx.fillStyle='#fff';
      ctx.font='20px Poppins';
      ctx.fillText(['Hundreds','Tens','Ones'][i], 60+i*260, 220);
    }
  } else if(type==='number line'){
    ctx.strokeStyle='#00e5ff'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(60,160); ctx.lineTo(800,160); ctx.stroke();
    for(let i=0;i<=10;i++){
      const x = 60+i*74;
      ctx.beginPath(); ctx.moveTo(x,150); ctx.lineTo(x,170); ctx.stroke();
      ctx.fillStyle='#9fb0d0'; ctx.font='16px Poppins';
      ctx.fillText(i, x-5, 195);
    }
    ctx.fillStyle='#ff6b2b';
    ctx.beginPath(); ctx.arc(60+3*74,160,10,0,7); ctx.fill();
  } else if(type==='array'){
    ctx.fillStyle='#ffd600';
    for(let r=0;r<4;r++) for(let cc=0;cc<6;cc++){
      ctx.beginPath(); ctx.arc(80+cc*60, 70+r*60, 18, 0, 7); ctx.fill();
    }
  } else if(type==='bar model'){
    ctx.fillStyle='#ff6b2b'; ctx.fillRect(80,90,360,70);
    ctx.fillStyle='#00e5ff'; ctx.fillRect(450,90,260,70);
    ctx.fillStyle='#0a0e1a'; ctx.font='bold 22px Poppins';
    ctx.fillText('Part A', 200, 132);
    ctx.fillText('Part B', 540, 132);
  } else {
    ctx.fillStyle='#9fb0d0'; ctx.font='24px Poppins';
    ctx.fillText('No manipulative for this task', 220, 165);
  }
}

let timerSecondsLeft = 0;
function resetTimer(){
  clearInterval(timerInterval); timerInterval=null;
  timerSecondsLeft = 0;
  document.getElementById('timer-display').textContent='--:--';
}
function startTimer(secs){
  clearInterval(timerInterval);
  timerSecondsLeft = secs;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timerSecondsLeft--;
    updateTimerDisplay();
    if(timerSecondsLeft<=0){
      clearInterval(timerInterval);
      document.getElementById('timer-display').style.color = 'var(--orange)';
      playChime();
    }
  },1000);
}
function updateTimerDisplay(){
  const m = Math.floor(timerSecondsLeft/60);
  const s = timerSecondsLeft%60;
  document.getElementById('timer-display').style.color='var(--yellow)';
  document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function setupMaster(lesson){
  const wrap = document.getElementById('master-steps');
  wrap.innerHTML='';
  (lesson.masterSteps||[]).forEach(()=>{
    const div = document.createElement('div');
    div.className='master-step';
    wrap.appendChild(div);
  });
  const btn = document.getElementById('btn-next-step');
  btn.disabled = (lesson.masterSteps||[]).length===0;
  btn.textContent = 'Show next step ▸';
  btn.onclick = ()=>{
    const steps = wrap.querySelectorAll('.master-step');
    if(masterStepIndex < steps.length){
      steps[masterStepIndex].textContent = lesson.masterSteps[masterStepIndex];
      steps[masterStepIndex].classList.add('show');
      masterStepIndex++;
      if(masterStepIndex>=steps.length){
        btn.disabled = true;
        btn.textContent = 'All steps shown ✓';
        burstParticles(btn);
      }
    }
  };
}

function setupPractice(lesson){
  const list = document.getElementById('practice-list');
  list.innerHTML='';
  const total = (lesson.practiceQ||[]).length;
  updatePracticeProgress(0, total);
  const btn = document.getElementById('btn-next-question');
  btn.disabled = total===0;
  btn.textContent = 'Reveal next question ▸';

  btn.onclick = ()=>{
    if(practiceIndex < total){
      const card = document.createElement('div');
      card.className='question-card';
      card.innerHTML = `<div>Q${practiceIndex+1}. ${lesson.practiceQ[practiceIndex]}</div>
        <div class="answer-box" data-idx="${practiceIndex}">Tap to reveal answer</div>`;
      list.appendChild(card);
      requestAnimationFrame(()=>card.classList.add('show'));

      const ansBox = card.querySelector('.answer-box');
      ansBox.onclick = ()=>{
        if(revealedAnswers.has(practiceIndex)) return;
        revealedAnswers.add(practiceIndex);
        ansBox.textContent = `✓ ${lesson.practiceA[ansBox.dataset.idx] ?? '(no answer set)'}`;
        ansBox.classList.add('revealed');
        playChime();
      };

      practiceIndex++;
      updatePracticeProgress(practiceIndex, total);
      if(practiceIndex>=total){
        btn.disabled = true;
        btn.textContent = 'All questions revealed ✓';
        burstParticles(btn);
      }
    }
  };
}
function updatePracticeProgress(curr,total){
  document.getElementById('practice-progress').textContent =
    total===0 ? 'No guided practice questions set' : `Question ${Math.min(curr,total)} of ${total} revealed`;
}

/* ============================ AUDIO (chime) ============================ */
// Generate a short pleasant chime using Web Audio API (no external file needed)
let audioCtx = null;
function playChime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [880, 1320].forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02 + i*0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6 + i*0.05);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i*0.05);
      osc.stop(now + 0.7 + i*0.05);
    });
  }catch(e){}
}

/* ============================ PARTICLE BURST ============================ */
function burstParticles(originEl){
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ['#ff6b2b','#ffd600','#00e5ff','#ffffff'];
  for(let i=0;i<24;i++){
    const p = document.createElement('div');
    p.className='particle';
    const size = 6+Math.random()*8;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = cx+'px';
    p.style.top = cy+'px';
    p.style.background = colors[i%colors.length];
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2;
    const dist = 80+Math.random()*160;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    p.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px, ${dy}px) scale(0)`, opacity:0 }
    ], { duration: 700+Math.random()*400, easing:'cubic-bezier(.2,.7,.3,1)' });
    setTimeout(()=>p.remove(), 1200);
  }
}

/* ============================ PIN MODAL ============================ */
let pinBuffer = '';
let pinPurpose = null; // 'open-admin' | 'change-pin'
function buildPinKeys(){
  const wrap = document.getElementById('pin-keys');
  wrap.innerHTML='';
  for(let i=1;i<=9;i++){
    const b = document.createElement('button');
    b.textContent = i;
    b.onclick = ()=> pinPress(i.toString());
    wrap.appendChild(b);
  }
  const clr = document.createElement('button'); clr.textContent='Clear';
  clr.onclick = ()=>{ pinBuffer=''; updatePinDisplay(); };
  wrap.appendChild(clr);
  const zero = document.createElement('button'); zero.textContent='0';
  zero.onclick = ()=> pinPress('0');
  wrap.appendChild(zero);
  const del = document.createElement('button'); del.textContent='⌫';
  del.onclick = ()=>{ pinBuffer = pinBuffer.slice(0,-1); updatePinDisplay(); };
  wrap.appendChild(del);
}
buildPinKeys();
function updatePinDisplay(){
  const d = pinBuffer.padEnd(4,'‒').split('').join(' ');
  document.getElementById('pin-display').textContent = d;
}
function pinPress(digit){
  if(pinBuffer.length>=4) return;
  pinBuffer += digit;
  updatePinDisplay();
  if(pinBuffer.length===4){
    setTimeout(()=>{
      if(pinBuffer===getPin()){
        document.getElementById('pin-overlay').classList.remove('active');
        pinBuffer='';
        updatePinDisplay();
        openAdminPanel();
      } else {
        document.getElementById('pin-display').style.color = '#ff3b3b';
        setTimeout(()=>{
          document.getElementById('pin-display').style.color='var(--yellow)';
          pinBuffer='';
          updatePinDisplay();
        },500);
      }
    },150);
  }
}
document.getElementById('gear-btn').onclick = ()=>{
  pinBuffer=''; updatePinDisplay();
  document.getElementById('pin-display').style.color='var(--yellow)';
  document.getElementById('pin-overlay').classList.add('active');
};
document.getElementById('pin-cancel').onclick = ()=>{
  document.getElementById('pin-overlay').classList.remove('active');
};

document.getElementById('admin-close').onclick = ()=>{

function renderAdminBody(){
  const body = document.getElementById('admin-body');
  body.innerHTML = '';

  // Change PIN row
  const pinRow = document.createElement('div');
  pinRow.style.cssText='display:flex;justify-content:space-between;align-items:center;background:#0d1326;border-radius:12px;padding:16px 20px;margin-bottom:24px;';
  pinRow.innerHTML = `<div>🔒 Admin PIN: currently set</div>`;
  const changeBtn = document.createElement('button');
  changeBtn.className='icon-btn'; changeBtn.textContent='Change PIN';
  changeBtn.onclick = openChangePinForm;
  pinRow.appendChild(changeBtn);
  body.appendChild(pinRow);

  // Add book button
  const addBookBtn = document.createElement('button');
  addBookBtn.className='btn btn-primary';
  addBookBtn.textContent = '+ Add Book';
  addBookBtn.style.marginBottom='20px';
  addBookBtn.onclick = openAddBookForm;
  body.appendChild(addBookBtn);

  DATA.books.forEach(book=>{
    const bSection = document.createElement('div');
    bSection.style.cssText='border:1px solid #334;border-radius:14px;padding:16px;margin-bottom:18px;';
    bSection.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="font-size:26px;color:var(--cyan);">📘 Book ${escapeHtml(book.name)}</h3>
        <div class="actions"></div>
      </div>`;
    const actions = bSection.querySelector('.actions');
    const addChBtn = document.createElement('button');
    addChBtn.className='icon-btn'; addChBtn.textContent='+ Chapter';
    addChBtn.onclick = ()=> openAddChapterForm(book);
    const delBookBtn = document.createElement('button');
    delBookBtn.className='icon-btn'; delBookBtn.textContent='Delete book';
    delBookBtn.onclick = ()=> { if(confirm(`Delete Book ${book.name} and all its content?`)){ DATA.books = DATA.books.filter(b=>b.id!==book.id); saveData(DATA); renderAdminBody(); renderHome(); } };
    actions.append(addChBtn, delBookBtn);

    book.chapters.forEach(ch=>{
      const chRow = document.createElement('div');
      chRow.style.cssText='margin:12px 0 0 20px;border-left:3px solid var(--orange);padding-left:14px;';
      chRow.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font-size:22px;">📂 ${escapeHtml(ch.name)}</strong>
          <div class="actions"></div>
        </div>`;
      const chActions = chRow.querySelector('.actions');
      const addLBtn = document.createElement('button');
      addLBtn.className='icon-btn'; addLBtn.textContent='+ Lesson';
      addLBtn.onclick = ()=> openLessonForm(book, ch, null);
      const delChBtn = document.createElement('button');
      delChBtn.className='icon-btn'; delChBtn.textContent='Delete chapter';
      delChBtn.onclick = ()=>{ if(confirm(`Delete "${ch.name}"?`)){ book.chapters = book.chapters.filter(c=>c.id!==ch.id); saveData(DATA); renderAdminBody(); } };
      chActions.append(addLBtn, delChBtn);

      ch.lessons.forEach((l, idx)=>{
        const row = document.createElement('div');
        row.className='admin-list-row';
        row.style.marginTop='10px';
        row.innerHTML = `<div>📝 Lesson ${l.number}: ${escapeHtml(l.title)}</div><div class="actions"></div>`;
        const a = row.querySelector('.actions');
        if(idx>0){
          const up = document.createElement('button'); up.className='icon-btn'; up.textContent='↑';
          up.onclick = ()=>{ [ch.lessons[idx-1],ch.lessons[idx]]=[ch.lessons[idx],ch.lessons[idx-1]]; saveData(DATA); renderAdminBody(); };
          a.appendChild(up);
        }
        if(idx<ch.lessons.length-1){
          const down = document.createElement('button'); down.className='icon-btn'; down.textContent='↓';
          down.onclick = ()=>{ [ch.lessons[idx+1],ch.lessons[idx]]=[ch.lessons[idx],ch.lessons[idx+1]]; saveData(DATA); renderAdminBody(); };
          a.appendChild(down);
        }
        const editBtn = document.createElement('button'); editBtn.className='icon-btn'; editBtn.textContent='Edit';
        editBtn.onclick = ()=> openLessonForm(book, ch, l);
        const delBtn = document.createElement('button'); delBtn.className='icon-btn'; delBtn.textContent='Delete';
        delBtn.onclick = ()=>{ if(confirm(`Delete lesson "${l.title}"?`)){ ch.lessons = ch.lessons.filter(x=>x.id!==l.id); saveData(DATA); renderAdminBody(); } };
        a.append(editBtn, delBtn);
        chRow.appendChild(row);
      });
      bSection.appendChild(chRow);
    });
    body.appendChild(bSection);
  });
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML;
}

function openLessonForm(book, chapter, lesson){
  const isEdit = !!lesson;
  const l = lesson || { number: chapter.lessons.length+1, title:'', exploreText:'', manipulative:'none', masterSteps:[], practiceQ:[], practiceA:[] };
  openForm(isEdit ? `Edit Lesson` : `Add Lesson to ${chapter.name}`, `
    <label>Lesson number</label>
    <input id="f-l-number" type="number" min="1" value="${l.number}">
    <label>Lesson title</label>
    <input id="f-l-title" type="text" value="${escapeHtml(l.title)}" placeholder="Adding Whole Numbers">
    <label>Explore Task text (exact MNP wording)</label>
    <textarea id="f-l-explore">${escapeHtml(l.exploreText)}</textarea>
    <label>Explore Task manipulative</label>
    <select id="f-l-manip">
      ${['none','place value blocks','number line','array','bar model'].map(m=>
        `<option value="${m}" ${l.manipulative===m?'selected':''}>${m}</option>`).join('')}
    </select>
    <label>Master content — one step per line</label>
    <textarea id="f-l-master">${escapeHtml((l.masterSteps||[]).join('\n'))}</textarea>
    <label>Guided Practice questions — one per line</label>
    <textarea id="f-l-pq">${escapeHtml((l.practiceQ||[]).join('\n'))}</textarea>
    <label>Guided Practice answers — one per line (matching order)</label>
    <textarea id="f-l-pa">${escapeHtml((l.practiceA||[]).join('\n'))}</textarea>
  `, ()=>{
    const number = parseInt(document.getElementById('f-l-number').value,10) || 1;
    const title = document.getElementById('f-l-title').value.trim();
    if(!title){ alert('Please enter a lesson title.'); return false; }
    const exploreText = document.getElementById('f-l-explore').value.trim();
    const manipulative = document.getElementById('f-l-manip').value;
    const splitLines = s => s.split('\n').map(x=>x.trim()).filter(x=>x.length>0);
    const masterSteps = splitLines(document.getElementById('f-l-master').value);
    const practiceQ = splitLines(document.getElementById('f-l-pq').value);
    const practiceA = splitLines(document.getElementById('f-l-pa').value);

    if(isEdit){
      Object.assign(lesson, { number, title, exploreText, manipulative, masterSteps, practiceQ, practiceA });
    } else {
      chapter.lessons.push({ id:uid(), number, title, exploreText, manipulative, masterSteps, practiceQ, practiceA });
    }
    saveData(DATA);
    renderAdminBody();
  });
}
