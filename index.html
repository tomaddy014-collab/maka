<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0d0b0a" />
<title>ATLAS — Bear the Weight</title>
<!--
  ============================================================================
  ATLAS — Phase 1 (Skeleton)  · single-file, self-contained, offline-capable
  ============================================================================
  Personal single-user fitness / health / nutrition / weightlifting tracker.
  Old-school Golden Age bodybuilding theme.

  WHY ONE FILE: this repo deploys by committing index.html. The full plan
  (React + Vite + FastAPI + Supabase) is the eventual target; Phase 1's
  deliverables are all client-side, so they live here. PROJECT_NOTES.md
  records where the real backend slots in (Phase 2+).

  PHASE 1 SCOPE BUILT HERE:
    - Atlas dark/gritty theme (charcoal base, oxblood accent, brass highlight,
      off-white newsprint text, subtle grain texture) + condensed display type.
    - Placeholder Atlas-the-Titan logo (SVG) — replace freely.
    - Single-user password gate (client-side; NOT real security — see notes).
    - Quote system: editable, category-seeded, context-aware per screen.
      ALL SEED QUOTES ARE PLACEHOLDERS — VERIFY/REPLACE BEFORE TRUSTING THEM.
    - Dashboard shell + navigation stubs for Phases 2-5.
    - Forward-looking localStorage data model (incl. photo upload) that mirrors
      the planned Postgres schema so later phases slot in cleanly.

  No external network calls. No CDN. Works offline. Web-safe font stacks.
  ============================================================================
-->
<style>
  /* ---------------------------------------------------------------------- */
  /* THEME TOKENS — the Atlas palette lives here, change once, applies all. */
  /* ---------------------------------------------------------------------- */
  :root {
    --base:        #0d0b0a;  /* near-black charcoal */
    --base-2:      #15110f;  /* panel background */
    --base-3:      #1f1916;  /* raised panel / hover */
    --line:        #2c2420;  /* hairline borders */
    --oxblood:     #7c1c20;  /* deep crimson accent */
    --oxblood-hi:  #a82a30;  /* brighter crimson */
    --brass:       #b58a3c;  /* aged gold highlight */
    --brass-hi:    #d8b25c;  /* brighter brass */
    --ink:         #ece4d6;  /* off-white newsprint text */
    --ink-dim:     #9c9082;  /* muted text */
    --ink-faint:   #6a6056;  /* faint labels */
    --good:        #5c8a4a;
    --warn:        #c08a2c;
    --bad:         #a82a30;
    --radius:      10px;
    --shadow:      0 18px 40px rgba(0,0,0,.55);
    /* heavy condensed display face for headers; clean body face for text */
    --font-display: "Oswald", "Bebas Neue", "Archivo Narrow", "Franklin Gothic Medium",
                    "Arial Narrow", Impact, system-ui, sans-serif;
    --font-body:    "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--base);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    /* subtle concrete grain + vignette, painted in CSS so it ships offline */
    background-image:
      radial-gradient(1200px 600px at 50% -10%, rgba(124,28,32,.10), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(181,138,60,.06), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.035'/></svg>");
    background-attachment: fixed;
  }

  h1, h2, h3, .display {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
    margin: 0;
    line-height: 1.05;
  }

  a { color: var(--brass-hi); text-decoration: none; }
  button { font-family: var(--font-body); cursor: pointer; }

  /* ---------------------------------------------------------------------- */
  /* LAYOUT                                                                  */
  /* ---------------------------------------------------------------------- */
  .app { display: none; min-height: 100%; }
  .app.active { display: grid; grid-template-columns: 240px 1fr; }

  .sidebar {
    background: linear-gradient(180deg, var(--base-2), var(--base));
    border-right: 1px solid var(--line);
    padding: 22px 16px;
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 6px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand .wordmark { font-family: var(--font-display); font-size: 30px; letter-spacing: .06em; }
  .brand .wordmark b { color: var(--brass-hi); }
  .brand .tag { font-size: 10px; letter-spacing: .28em; color: var(--ink-faint); text-transform: uppercase; }

  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    color: var(--ink-dim); padding: 10px 12px; border-radius: var(--radius);
    font-size: 14px; letter-spacing: .02em; transition: all .15s ease;
  }
  .nav-btn:hover { background: var(--base-3); color: var(--ink); }
  .nav-btn.active {
    background: linear-gradient(180deg, rgba(124,28,32,.35), rgba(124,28,32,.18));
    border-color: rgba(168,42,48,.5); color: var(--ink);
    box-shadow: inset 0 0 0 1px rgba(216,178,92,.10);
  }
  .nav-btn .ico { width: 18px; text-align: center; opacity: .9; }
  .nav-btn .soon { margin-left: auto; font-size: 9px; letter-spacing: .15em;
    color: var(--ink-faint); border: 1px solid var(--line); padding: 1px 5px; border-radius: 6px; }

  .sidebar .spacer { flex: 1; }
  .sidebar .footer { font-size: 11px; color: var(--ink-faint); }
  .lockbtn { margin-top: 8px; }

  .main { padding: 28px clamp(18px, 4vw, 44px); max-width: 1100px; }
  .topline { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .topline h1 { font-size: clamp(34px, 5vw, 56px); }
  .topline .date { color: var(--ink-faint); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }

  /* ---------------------------------------------------------------------- */
  /* QUOTE BANNER — context-aware, fired by current screen.                 */
  /* ---------------------------------------------------------------------- */
  .quote {
    margin: 22px 0 28px; padding: 20px 22px;
    border-left: 3px solid var(--oxblood-hi);
    background: linear-gradient(90deg, rgba(124,28,32,.12), rgba(21,17,15,.4));
    border-radius: 0 var(--radius) var(--radius) 0;
    position: relative;
  }
  .quote .mark { font-family: var(--font-display); font-size: 52px; color: var(--oxblood);
    position: absolute; top: -6px; left: 12px; opacity: .4; }
  .quote blockquote { margin: 0 0 0 38px; font-size: 18px; font-style: italic; color: var(--ink); }
  .quote .by { margin: 8px 0 0 38px; font-family: var(--font-display); letter-spacing: .1em;
    color: var(--brass-hi); font-size: 13px; }
  .quote .cat { position: absolute; top: 12px; right: 14px; font-size: 9px; letter-spacing: .2em;
    color: var(--ink-faint); text-transform: uppercase; }
  .quote .verify { display: inline-block; margin-left: 8px; font-size: 9px; letter-spacing: .12em;
    color: var(--warn); border: 1px solid rgba(192,138,44,.4); padding: 1px 5px; border-radius: 5px;
    text-transform: uppercase; }

  /* ---------------------------------------------------------------------- */
  /* CARDS / GRID                                                           */
  /* ---------------------------------------------------------------------- */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card {
    background: linear-gradient(180deg, var(--base-2), var(--base-3));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
  }
  .card h3 { font-size: 15px; letter-spacing: .12em; color: var(--ink-dim); margin-bottom: 10px; }
  .stat { font-family: var(--font-display); font-size: 40px; color: var(--ink); }
  .stat small { font-size: 14px; color: var(--ink-faint); font-family: var(--font-body); }
  .placeholder-note { color: var(--ink-faint); font-size: 13px; font-style: italic; }

  .section-title { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; }
  .section-title h2 { font-size: 22px; letter-spacing: .08em; color: var(--ink); }
  .section-title .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  .pill { display:inline-block; font-size: 11px; letter-spacing:.1em; text-transform:uppercase;
    padding: 3px 9px; border-radius: 20px; border:1px solid var(--line); color: var(--ink-dim); }
  .pill.soon { color: var(--brass); border-color: rgba(181,138,60,.35); }

  /* ---------------------------------------------------------------------- */
  /* PASSWORD GATE                                                          */
  /* ---------------------------------------------------------------------- */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate.hidden { display: none; }
  .gate-card {
    width: min(420px, 100%); background: linear-gradient(180deg, var(--base-2), var(--base));
    border: 1px solid var(--line); border-radius: 16px; padding: 36px 30px; text-align: center;
    box-shadow: var(--shadow);
  }
  .gate-card .logo { margin: 0 auto 14px; }
  .gate-card h1 { font-size: 46px; letter-spacing: .08em; }
  .gate-card h1 b { color: var(--brass-hi); }
  .gate-card .tag { color: var(--ink-faint); letter-spacing: .3em; font-size: 11px;
    text-transform: uppercase; margin: 6px 0 26px; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display:block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 6px; }
  input[type=password], input[type=text] {
    width: 100%; background: var(--base); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); padding: 12px 14px; font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--oxblood-hi); box-shadow: 0 0 0 3px rgba(124,28,32,.25); }
  .btn {
    width: 100%; padding: 13px; border-radius: 8px; border: 1px solid rgba(168,42,48,.6);
    background: linear-gradient(180deg, var(--oxblood-hi), var(--oxblood));
    color: var(--ink); font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
    font-family: var(--font-display); transition: filter .15s ease;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-dim); }
  .gate-msg { min-height: 20px; color: var(--bad); font-size: 13px; margin-top: 12px; }
  .gate-hint { color: var(--ink-faint); font-size: 12px; margin-top: 18px; line-height: 1.6; }

  .mobile-nav { display: none; }

  /* ---------------------------------------------------------------------- */
  /* RESPONSIVE                                                             */
  /* ---------------------------------------------------------------------- */
  @media (max-width: 760px) {
    .app.active { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .mobile-nav {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px;
      position: sticky; top: 0; z-index: 5; background: var(--base-2);
      border-bottom: 1px solid var(--line);
    }
    .mobile-nav .nav-btn { width: auto; white-space: nowrap; }
    .mobile-nav .nav-btn .soon { display: none; }
    .main { padding: 18px; }
  }
</style>
</head>

<!-- ====================== MAIN APP ====================== -->
<div class="app" id="app">
  <aside class="sidebar">

        <div class="wordmark">ATL<b>A</b>S</div>

<script>
/* ========================================================================
   ATLAS — Phase 1 application logic (vanilla JS, no dependencies)
   ======================================================================== */

/* ---- Placeholder Atlas-the-Titan logo (replace this SVG freely) -------- */
function atlasLogo(size) {
  size = size || 56;
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" aria-label="Atlas logo">
    <defs>
      <radialGradient id="globe-${size}" cx="40%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#d8b25c"/>
        <stop offset="60%" stop-color="#b58a3c"/>
        <stop offset="100%" stop-color="#7c1c20"/>
      </radialGradient>
    </defs>
    <!-- the world -->
    <circle cx="32" cy="17" r="13" fill="url(#globe-${size})" stroke="#2c2420" stroke-width="1.5"/>
    <path d="M22 14 Q32 9 42 14 M21 20 Q32 24 43 20 M32 5 L32 30" stroke="#0d0b0a" stroke-width="1" opacity=".4" fill="none"/>
    <!-- Atlas: shoulders + bent figure bearing the globe -->
    <path d="M14 32 Q20 30 24 33 L24 38 Q20 40 18 46 L14 60 M50 32 Q44 30 40 33 L40 38 Q44 40 46 46 L50 60"
          stroke="#ece4d6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M24 33 Q32 30 40 33" stroke="#ece4d6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="31" r="3.2" fill="#ece4d6"/>
  </svg>`;
}

/* ========================================================================
   STORAGE LAYER
   Mirrors the planned Postgres schema so Phase 2+ can lift it into SQLAlchemy
   with minimal friction. Single localStorage key holds the whole "DB".
   Tables represented: user, activities, sleep_records, body_metrics,
   recovery_scores, workouts, exercises, sets, food_entries, foods,
   nutrition_targets, photos (meal/progress), quotes.
   ======================================================================== */
const DB_KEY = "atlas_db_v1";
const AUTH_KEY = "atlas_auth_v1";

function emptyDB() {
  return {
    meta: { schemaVersion: 1, units: { mass: "kg", distance: "km", length: "cm", energy: "kcal", time24h: true } },
    user: { id: 1, displayName: "Athlete", goals: ["fat_loss", "endurance"] },
    // ---- Phase 2 (Garmin) ----
    activities: [], sleep_records: [], body_metrics: [], recovery_scores: [],
    // ---- Phase 3 (Lifting) ----
    exercises: [], workouts: [], sets: [],
    // ---- Phase 4 (Nutrition) ----
    foods: [], food_entries: [], nutrition_targets: [],
    // ---- Photos: meal photos + progress pics (you opted IN) ----
    // each: {id, kind:'meal'|'progress', ref_id, taken_at, data_url, note}
    photos: [],
    // ---- Quote bank (seeded below) ----
    quotes: []
  };
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

/* ========================================================================
   QUOTE BANK  ⚠️  PLACEHOLDERS ONLY — VERIFY & REPLACE BEFORE TRUSTING.
   ------------------------------------------------------------------------
   LLMs (me included) confidently invent and MISATTRIBUTE quotes from real
   people. Every entry below is a PLACEHOLDER seeded for layout/testing.
   `verified: false` marks them as UNCHECKED. Do NOT present them as
   authentic until YOU have confirmed wording + attribution from a real
   source, then flip `verified` to true.
   Categories: pre_workout, discipline, nutrition, recovery, perseverance.
   This array is the editable "quotes table". In Phase 2 it becomes a DB
   table seeded from this same JSON.
   ======================================================================== */
const SEED_QUOTES = [
  // --- pre_workout ---
  { id: 1, category: "pre_workout", verified: false, author: "PLACEHOLDER — verify",
    text: "The last three reps is what makes the muscle grow." },
  { id: 2, category: "pre_workout", verified: false, author: "PLACEHOLDER — verify",
    text: "Everybody wants to be a bodybuilder, but nobody wants to lift heavy-ass weight." },
  { id: 3, category: "pre_workout", verified: false, author: "PLACEHOLDER — verify",
    text: "Step under the bar like you mean it, or don't step under it at all." },
  // --- discipline ---
  { id: 4, category: "discipline", verified: false, author: "PLACEHOLDER — verify",
    text: "Discipline is doing the work on the day you have every excuse not to." },
  { id: 5, category: "discipline", verified: false, author: "PLACEHOLDER — verify",
    text: "Motivation gets you started; the routine carries you the rest of the way." },
  { id: 6, category: "discipline", verified: false, author: "PLACEHOLDER — verify",
    text: "Champions are built in the hours nobody is watching." },
  // --- nutrition ---
  { id: 7, category: "nutrition", verified: false, author: "PLACEHOLDER — verify",
    text: "You can't out-train a careless kitchen." },
  { id: 8, category: "nutrition", verified: false, author: "PLACEHOLDER — verify",
    text: "Eat for the body you are building, not the one you have." },
  { id: 9, category: "nutrition", verified: false, author: "PLACEHOLDER — verify",
    text: "Protein, patience, and consistency — the rest is detail." },
  // --- recovery ---
  { id: 10, category: "recovery", verified: false, author: "PLACEHOLDER — verify",
    text: "The muscle is broken in the gym and built in your sleep." },
  { id: 11, category: "recovery", verified: false, author: "PLACEHOLDER — verify",
    text: "Rest is not the reward for the work; it is part of the work." },
  { id: 12, category: "recovery", verified: false, author: "PLACEHOLDER — verify",
    text: "Listen when the body asks for a quiet day — that is wisdom, not weakness." },
  // --- perseverance ---
  { id: 13, category: "perseverance", verified: false, author: "PLACEHOLDER — verify",
    text: "Fall down seven times, load the bar an eighth." },
  { id: 14, category: "perseverance", verified: false, author: "PLACEHOLDER — verify",
    text: "Strength is the residue of showing up after the failures." },
  { id: 15, category: "perseverance", verified: false, author: "PLACEHOLDER — verify",
    text: "The weight does not care how you feel; pick it up anyway." }
];

/* Pick a context-appropriate quote for a screen. Deterministic-per-day so it
   doesn't flicker on every render but still rotates. */
function quoteFor(category) {
  const db = window.__db;
  const pool = (db.quotes.length ? db.quotes : SEED_QUOTES).filter(q => q.category === category);
  if (!pool.length) return null;
  const daySeed = Math.floor(Date.now() / 86400000);
  return pool[daySeed % pool.length];
}

function renderQuoteBanner(category) {
  const q = quoteFor(category);
  if (!q) return "";
  const verifyTag = q.verified ? "" : `<span class="verify" title="Unverified placeholder — confirm before trusting">⚠ unverified</span>`;
  return `
    <div class="quote">
      <span class="mark">&ldquo;</span>
      <span class="cat">${category.replace("_"," ")}</span>
      <blockquote>${q.text}</blockquote>
      <div class="by">— ${q.author} ${verifyTag}</div>
    </div>`;
}

/* ========================================================================
   AUTH — single-user passphrase gate (client-side only).
   Stored hashed in localStorage. This is a privacy curtain, NOT security.
   Real auth (password env var + JWT) lands in the FastAPI backend, Phase 2.
   ======================================================================== */
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function authState() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch { return null; }
}

const gate = document.getElementById("gate");
const app = document.getElementById("app");

function showGate() {
  const a = authState();
  document.getElementById("gateLoginView").style.display = a ? "block" : "none";
  document.getElementById("gateSetupView").style.display = a ? "none" : "block";
  document.getElementById("gateHint").textContent = a
    ? "Welcome back. Forgotten it? Clear site data to reset (wipes local data)."
    : "";
  gate.classList.remove("hidden");
  app.classList.remove("active");
}

function unlock() {
  if (!window.__db) bootDB();
  gate.classList.add("hidden");
  app.classList.add("active");
  navigate("dashboard");
}

document.getElementById("enterBtn").onclick = async () => {
  const a = authState();
  const pw = document.getElementById("pw").value;
  const msg = document.getElementById("gateMsg");
  if (!pw) { msg.textContent = "Enter your passphrase."; return; }
  const h = await sha256(pw + a.salt);
  if (h === a.hash) { msg.textContent = ""; document.getElementById("pw").value = ""; unlock(); }
  else { msg.textContent = "Wrong passphrase. Try again."; }
};
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("enterBtn").click(); });

document.getElementById("setupBtn").onclick = async () => {
  const a = document.getElementById("pwNew").value;
  const b = document.getElementById("pwConfirm").value;
  const msg = document.getElementById("setupMsg");
  if (a.length < 4) { msg.textContent = "Use at least 4 characters."; return; }
  if (a !== b) { msg.textContent = "Passphrases don't match."; return; }
  const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const hash = await sha256(a + salt);
  localStorage.setItem(AUTH_KEY, JSON.stringify({ salt, hash, created: new Date().toISOString() }));
  showGate(); unlock();
};

document.getElementById("lockBtn").onclick = () => showGate();

/* ========================================================================
   DB BOOT — create + seed on first run.
   ======================================================================== */
function bootDB() {
  let db = loadDB();
  if (!db) { db = emptyDB(); db.quotes = SEED_QUOTES.map(q => ({ ...q })); saveDB(db); }
  if (!db.quotes || !db.quotes.length) { db.quotes = SEED_QUOTES.map(q => ({ ...q })); saveDB(db); }
  window.__db = db;
}

/* ========================================================================
   NAVIGATION + VIEWS
   Each phase gets a screen; Phases 2-5 are clearly-marked stubs so the
   shell + quote contexts are testable now.
   ======================================================================== */
const SCREENS = [
  { id: "dashboard", label: "Dashboard",  ico: "▦", quote: "discipline",   phase: 1 },
  { id: "garmin",    label: "Garmin",     ico: "❤", quote: "recovery",     phase: 2 },
  { id: "lifting",   label: "Lifting",    ico: "▤", quote: "pre_workout",  phase: 3 },
  { id: "nutrition", label: "Nutrition",  ico: "◍", quote: "nutrition",    phase: 4 },
  { id: "analytics", label: "Analytics",  ico: "◔", quote: "perseverance", phase: 5 },
  { id: "quotes",    label: "Quote Bank", ico: "❝", quote: "discipline",   phase: 1 }
];

function buildNav() {
  const make = (s) => `
    <button class="nav-btn" data-screen="${s.id}">
      <span class="ico">${s.ico}</span><span>${s.label}</span>
      ${s.phase > 1 ? `<span class="soon">P${s.phase}</span>` : ``}
    </button>`;
  const html = SCREENS.map(make).join("");
  document.getElementById("nav").innerHTML = html;
  document.getElementById("mobileNav").innerHTML = html;
  document.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => navigate(b.dataset.screen));
}

let current = "dashboard";
function navigate(id) {
  current = id;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.screen === id));
  const screen = SCREENS.find(s => s.id === id);
  document.getElementById("view").innerHTML = VIEWS[id](screen);
  window.scrollTo(0, 0);
}

const fmtDate = () => new Date().toLocaleDateString("en-NZ", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function stubScreen(title, phase, quoteCat, lines) {
  return `
    <div class="topline"><h1>${title}</h1><div class="date">${fmtDate()}</div></div>
    ${renderQuoteBanner(quoteCat)}
    <div class="card" style="border-color: rgba(181,138,60,.3);">
      <h3>Coming in Phase ${phase} <span class="pill soon">Stub</span></h3>
      <p class="placeholder-note">${lines}</p>
    </div>`;
}

const VIEWS = {
  dashboard: () => `
    <div class="topline"><h1>The Dashboard</h1><div class="date">${fmtDate()}</div></div>
    ${renderQuoteBanner("discipline")}

    <div class="section-title"><h2>Today at a Glance</h2><div class="rule"></div></div>
    <div class="grid">
      <div class="card"><h3>Readiness</h3><div class="stat">—<small> /100</small></div>
        <p class="placeholder-note">Garmin recovery lands in Phase 2.</p></div>
      <div class="card"><h3>Last Activity</h3><div class="stat">—</div>
        <p class="placeholder-note">Garmin sync, Phase 2.</p></div>
      <div class="card"><h3>Sleep</h3><div class="stat">—<small> h</small></div>
        <p class="placeholder-note">Garmin sleep, Phase 2.</p></div>
      <div class="card"><h3>Body Weight</h3><div class="stat">—<small> kg</small></div>
        <p class="placeholder-note">Body metrics, Phase 2.</p></div>
    </div>

    <div class="section-title"><h2>Build Roadmap</h2><div class="rule"></div></div>
    <div class="grid">
      ${SCREENS.filter(s => s.phase > 1).map(s => `
        <div class="card"><h3>${s.label} <span class="pill soon">Phase ${s.phase}</span></h3>
          <p class="placeholder-note">${roadmapBlurb(s.id)}</p></div>`).join("")}
    </div>

    <div class="section-title"><h2>Foundation Status</h2><div class="rule"></div></div>
    <div class="card">
      <p style="margin-top:0;">Phase 1 skeleton is live: Atlas theme, passphrase gate,
      context-aware quote system, and a forward-looking data model (incl. meal &amp;
      progress photos). Units default to <b>kg / km / cm</b>, 24-hour time, kcal+kJ.</p>
      <p class="placeholder-note">⚠ The seed quotes are unverified placeholders —
      open the <a href="#" onclick="navigate('quotes');return false;">Quote Bank</a> to review them.</p>
    </div>`,

  garmin: () => stubScreen("Garmin Sync", 2, "recovery",
    "Adapter layer (unofficial garth + official Health API stub), 'Sync now', scheduled background sync, and a recovery/sleep/activity dashboard. Low-readiness days surface a recovery quote — already wired above."),

  lifting: () => stubScreen("Iron Log", 3, "pre_workout",
    "Workout logging (sets/reps/weight/RPE), an extensible exercise library, progressive-overload charts, and automatic PR tracking. The pre-workout quote above sets the tone for the logging screen."),

  nutrition: () => stubScreen("Fuel", 4, "nutrition",
    "Food logging against daily macro/calorie targets (kcal + kJ), Open Food Facts search + barcode lookup, meal photos, and daily/weekly summaries."),

  analytics: () => stubScreen("Analytics &amp; The Oracle", 5, "perseverance",
    "Cross-trends (training load vs recovery vs sleep) and the AI cardio suggestion engine — balances fat-loss vs endurance honestly, cross-references recovery &amp; lifting, advisory only with reasoning shown. The Anthropic key stays server-side (Phase 2 backend)."),

  quotes: () => quoteBankView()
};

function roadmapBlurb(id) {
  return {
    garmin: "Device sync: activities, sleep, recovery, body metrics — via a swappable adapter.",
    lifting: "Progressive overload, PR tracking, RPE, extensible exercise library.",
    nutrition: "Macros/calories vs targets, Open Food Facts + barcode, meal photos.",
    analytics: "Trends, cross-insights, and the advisory AI cardio engine."
  }[id] || "";
}

/* ---- Quote Bank editor (Phase 1 deliverable: editable, verifiable) ----- */
function quoteBankView() {
  const db = window.__db;
  const cats = ["pre_workout","discipline","nutrition","recovery","perseverance"];
  const rows = cats.map(cat => {
    const qs = db.quotes.filter(q => q.category === cat);
    return `
      <div class="section-title"><h2>${cat.replace("_"," ")}</h2><div class="rule"></div></div>
      <div class="grid">
        ${qs.map(q => `
          <div class="card">
            <blockquote style="margin:0 0 10px;font-style:italic;">&ldquo;${q.text}&rdquo;</blockquote>
            <div class="by" style="color:var(--brass-hi);font-family:var(--font-display);letter-spacing:.08em;">— ${q.author}</div>
            <div style="margin-top:10px;">
              ${q.verified
                ? `<span class="pill" style="color:var(--good);border-color:rgba(92,138,74,.4);">verified</span>`
                : `<span class="pill" style="color:var(--warn);border-color:rgba(192,138,44,.4);">⚠ unverified</span>
                   <button class="btn" style="width:auto;padding:6px 12px;margin-top:8px;display:block;"
                     onclick="markVerified(${q.id})">Mark verified</button>`}
            </div>
          </div>`).join("")}
      </div>`;
  }).join("");

  return `
    <div class="topline"><h1>Quote Bank</h1><div class="date">${fmtDate()}</div></div>
    <div class="card" style="border-color:rgba(192,138,44,.35);margin-bottom:6px;">
      <h3 style="color:var(--warn);">⚠ These are placeholders — verify before trusting</h3>
      <p class="placeholder-note" style="margin-bottom:0;">
        Quotes from real people are easy to misattribute. Each seed quote is marked
        <b>unverified</b>. Confirm the exact wording and author from a real source,
        then mark it verified. Edit the <code>SEED_QUOTES</code> array (or this stored
        table) to replace text/authors. In Phase 2 this becomes a Postgres
        <code>quotes</code> table seeded from the same JSON.
      </p>
    </div>
    ${rows}`;
}

function markVerified(id) {
  const db = window.__db;
  const q = db.quotes.find(x => x.id === id);
  if (q) { q.verified = true; q.author = q.author.replace(" — verify", " (you-confirmed)"); saveDB(db); navigate("quotes"); }
}
window.markVerified = markVerified;
window.navigate = navigate;

/* ========================================================================
   INIT
   ======================================================================== */
document.getElementById("gateLogo").innerHTML = atlasLogo(64);
document.getElementById("sideLogo").innerHTML = atlasLogo(40);
buildNav();
showGate();
</script>
</body>
</html>
