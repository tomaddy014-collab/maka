<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Māka — Student Hub</title>
<script>
(function(){try{
  var t=localStorage.getItem('maka-theme');
  if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f6f3;--bg3:#f5f0e8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#757067;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.16);
  --green:#2d5a27;--green-bg:#e8f0e6;
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --danger-bg:#fcebeb;--danger-text:#a32d2d;
  --info-bg:#e6f1fb;--info-text:#185fa5;
  --gold:#c8840a;--gold-soft:rgba(200,132,10,0.12);
  --r:12px;--rs:8px;--r-lg:18px;
  --nav-bg:rgba(245,240,232,0.72);--scrim:rgba(0,0,0,0.4);
  --sh-sm:0 1px 2px rgba(15,14,12,0.04),0 1px 3px rgba(15,14,12,0.04);
  --sh-md:0 8px 28px -10px rgba(15,14,12,0.12);
  --sh-lg:0 20px 50px -16px rgba(15,14,12,0.2);
  --ease:cubic-bezier(.25,.8,.25,1);--ease-spring:cubic-bezier(.16,1,.3,1)}
[data-theme="dark"]{
  --bg:#1c1b19;--bg2:#242220;--bg3:#161513;
  --text:#ece9e3;--text2:#a9a49b;--text3:#8d887f;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --green:#7fb87a;--green-bg:#23302180;
  --warn-bg:#3a2e1a;--warn-text:#e0b878;
  --danger-bg:#3a2020;--danger-text:#e89a9a;
  --info-bg:#1d2c3a;--info-text:#7fb0e0;
  --gold:#e0a52a;--gold-soft:rgba(224,165,42,0.16);
  --nav-bg:rgba(22,21,19,0.78);--scrim:rgba(0,0,0,0.6);
  --sh-md:0 8px 28px -10px rgba(0,0,0,0.5);--sh-lg:0 24px 60px -18px rgba(0,0,0,0.6);--sh-sm:0 1px 2px rgba(0,0,0,0.3)}
[data-theme="dark"] .logo>span{color:#ece9e3!important}
[data-theme="dark"] .logo span span span{background:#ece9e3!important}
[data-theme="dark"] .btn-p{background:#ece9e3;color:#1a1a1a;border-color:#ece9e3}
[data-theme="dark"] .btn-p:hover{background:#fff}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button,a,input,select,textarea{touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ICONS */
.ico{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* NAV */
nav{background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;transition:box-shadow .3s var(--ease),background .3s var(--ease)}
nav.scrolled{box-shadow:0 8px 30px -12px rgba(15,14,12,0.12)}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:800;color:#0f0e0c;text-decoration:none;letter-spacing:-.02em}
.logo span{color:var(--green)}
.nav-back{font-size:13px;color:var(--text2);text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:color .2s var(--ease)}
.nav-back:hover{color:var(--text)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s var(--ease),color .2s var(--ease)}
.icon-btn:hover{background:var(--bg2);color:var(--text)}

/* LAYOUT */
.main{max-width:1060px;margin:0 auto;padding:1.75rem 1.25rem 4rem}
.top-grid{display:grid;grid-template-columns:minmax(280px,1fr) 1.25fr;gap:1rem;margin-bottom:1rem}
.mid-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:840px){.top-grid,.mid-grid{grid-template-columns:1fr}}

/* CARDS */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;box-shadow:var(--sh-sm);animation:riseIn .5s var(--ease-spring) backwards;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.mid-grid .card,.top-grid .card{margin-bottom:0}
.card.flush{margin-bottom:1rem}
.sect-title{font-weight:600;font-size:14px;margin-bottom:1.1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sect-title .ico-chip{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);flex-shrink:0}
.sect-title .count{margin-left:auto;font-size:12px;font-weight:400;color:var(--text2)}

/* IDENTITY HEADER */
.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:1.25rem}
.ident{display:flex;align-items:center;gap:14px;min-width:0}
.avatar-lg{width:56px;height:56px;border-radius:18px;background:linear-gradient(140deg,var(--green) 0%,#3f7a37 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:800;font-size:26px;flex-shrink:0;box-shadow:var(--sh-md)}
.ident-name{font-family:'Fraunces',serif;font-size:clamp(1.5rem,4vw,1.9rem);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.ident-meta{font-size:13px;color:var(--text2);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gender-chip{font-size:11px;padding:2px 9px;border-radius:100px;font-weight:600}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;text-decoration:none;transition:background .2s var(--ease),transform .15s var(--ease-spring),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.btn:hover{background:var(--bg2);transform:translateY(-1px);box-shadow:var(--sh-md)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn .ico{font-size:15px}
.btn-p{background:#1a1a1a;color:#fff;border-color:#1a1a1a}.btn-p:hover{background:#333}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}.btn-green:hover{background:#1e3d1a;color:#fff}
.btn-danger{color:var(--danger-text);border-color:var(--border2)}.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger-text)}
.btn-sm{padding:7px 12px;font-size:12.5px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* PILLS */
.pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ph{background:var(--green-bg);color:var(--green)}
.pm{background:var(--warn-bg);color:var(--warn-text)}
.pl{background:var(--danger-bg);color:var(--danger-text)}

/* HERO SCORE CARD */
.hero-card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem 1.5rem;background:
  radial-gradient(120% 120% at 50% -10%,var(--gold-soft) 0%,transparent 55%),var(--bg)}
.hs-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hs-num{font-family:'Fraunces',serif;font-size:clamp(3.4rem,11vw,4.6rem);font-weight:800;line-height:.9;color:var(--text);font-variant-numeric:tabular-nums}
.hs-den{font-size:.3em;font-weight:600;color:var(--text3);letter-spacing:-.02em}
.hs-grade{display:inline-flex;align-items:center;gap:6px;margin-top:1rem;font-size:13.5px;font-weight:600;padding:8px 20px;border-radius:100px}
.grade-exceeds{background:rgba(200,132,10,0.14);color:#9c6500}
[data-theme="dark"] .grade-exceeds{color:var(--gold)}
.grade-achieved{background:var(--green-bg);color:var(--green)}
.grade-approaching{background:var(--warn-bg);color:var(--warn-text)}
.grade-beginning{background:var(--danger-bg);color:var(--danger-text)}
.hs-sub{font-size:12.5px;color:var(--text2);margin-top:12px}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.kpi{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;box-shadow:var(--sh-sm);transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease);animation:riseIn .5s var(--ease-spring) backwards}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.09s}.kpi:nth-child(3){animation-delay:.14s}.kpi:nth-child(4){animation-delay:.19s}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-ico{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2)}
.stat-num{font-family:'Fraunces',serif;font-size:1.85rem;font-weight:800;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.stat-num .unit{font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;color:var(--text3)}
.stat-lbl{font-size:11.5px;color:var(--text2);margin-top:6px}

/* CHART */
.chart-wrap{position:relative;height:210px;margin-top:6px}
.chart-toggle{display:inline-flex;gap:2px;background:var(--bg2);border-radius:100px;padding:3px;margin-left:auto}
.chart-tab{font-size:12px;font-weight:500;padding:5px 13px;border:none;background:none;border-radius:100px;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;transition:background .2s var(--ease),color .2s var(--ease)}
.chart-tab.active{background:var(--bg);color:var(--text);box-shadow:var(--sh-sm)}
.chart-tab:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:12px;color:var(--text2)}
.chart-legend .lg{display:flex;align-items:center;gap:6px}
.chart-legend .sw{width:14px;height:3px;border-radius:2px;flex-shrink:0}
canvas{width:100%!important}

/* CRITERION BARS */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{width:150px;font-size:12.5px;color:var(--text);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:9px;background:var(--bg2);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;width:0;transition:width 1s var(--ease-spring)}
.bar-val{width:42px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* SESSION CARDS */
.sess-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:.7rem;transition:box-shadow .3s var(--ease),transform .25s var(--ease),border-color .2s var(--ease)}
.sess-card:last-child{margin-bottom:0}
.sess-card:hover{box-shadow:var(--sh-md);border-color:var(--border2)}
.sess-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;cursor:pointer}
.sess-name{font-weight:600;font-size:14px}
.sess-meta{font-size:12px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:6px}
.sess-body{max-height:0;opacity:0;overflow:hidden;transition:max-height .45s var(--ease-spring),opacity .3s var(--ease),margin .3s var(--ease)}
.sess-body.open{max-height:2400px;opacity:1;margin-top:14px}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;table-layout:fixed}
.ctable th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);padding:4px 0 7px;border-bottom:1px solid var(--border)}
.ctable td{padding:8px 4px 8px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.ctable tr:last-child td{border-bottom:none}
.ctable .cn{width:55%;color:var(--text)}.ctable .cs{width:45%}
.total-row{font-size:13px;color:var(--text2);margin-bottom:4px}
.total-row strong{color:var(--text);font-variant-numeric:tabular-nums}
.slbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:14px 0 6px}
.sbox{font-size:13px;color:var(--text2);line-height:1.6;padding:11px 13px;background:var(--bg);border-radius:var(--rs)}
.sbox.improve{background:var(--gold-soft);border-left:3px solid var(--gold);color:var(--text);display:flex;gap:9px;align-items:flex-start}
.sbox.improve .ico{font-size:15px;color:var(--gold);margin-top:1px}
.chevron{color:var(--text3);transition:transform .35s var(--ease-spring);flex-shrink:0;display:inline-flex;font-size:18px}
.chevron.open{transform:rotate(90deg)}
.view-work{margin-top:14px;border-radius:100px}

/* COMMENT CARDS */
.comment-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:.7rem;transition:transform .25s var(--ease),box-shadow .3s var(--ease)}
.comment-card:last-child{margin-bottom:0}
.comment-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.comment-meta{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.comment-text{font-size:13.5px;line-height:1.75;color:var(--text)}
.copy-btn{font-size:11px;padding:5px 11px;border-radius:100px;border:1px solid var(--border2);background:var(--bg);cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;transition:background .2s var(--ease)}
.copy-btn:hover{background:var(--bg2);color:var(--text)}

/* REPORT GEN */
.rep-output{font-size:13.5px;line-height:1.8;background:var(--bg2);padding:16px;border-radius:var(--rs);margin-top:14px;display:none}

/* FORM */
.field{margin-bottom:14px}
.lbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
input[type=text],input[type=password],select,textarea{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
textarea{resize:vertical;min-height:60px;line-height:1.5}
.key-row{display:flex;gap:8px}.key-row input{flex:1;font-family:monospace;font-size:13px}
.eye-btn{padding:9px 12px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg2);cursor:pointer;font-size:14px;flex-shrink:0;color:var(--text2);display:inline-flex;align-items:center}
.eye-btn:hover{color:var(--text)}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .25s var(--ease);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-bg.open{display:flex;opacity:1}
.modal{background:var(--bg);border-radius:var(--r);padding:1.5rem;width:100%;max-width:440px;box-shadow:var(--sh-lg);transform:scale(.94) translateY(8px);transition:transform .35s var(--ease-spring)}
.modal-bg.open .modal{transform:scale(1) translateY(0)}
.modal-title{font-weight:600;font-size:16px;margin-bottom:1.1rem}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.pdf-modal{position:fixed;inset:0;background:var(--scrim);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.pdf-modal.open{display:flex;animation:riseIn .25s var(--ease)}
.pdf-modal-inner{background:var(--bg);border-radius:var(--r);width:100%;max-width:900px;height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-lg)}
.pdf-modal-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}

/* MISC */
.err{font-size:13px;color:var(--danger-text);background:var(--danger-bg);padding:11px 13px;border-radius:var(--rs);line-height:1.5}
.empty{text-align:center;padding:2.5rem 1.5rem;color:var(--text2);font-size:13.5px;line-height:1.6}
.empty .ico{font-size:26px;color:var(--text3);margin-bottom:10px}
.spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.delta{font-size:13px;font-weight:700;padding:3px 10px;border-radius:100px;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.d-up{background:var(--green-bg);color:var(--green)}
.d-dn{background:var(--danger-bg);color:var(--danger-text)}
.d-eq{background:var(--bg2);color:var(--text3)}
.btn:focus-visible,.copy-btn:focus-visible,.eye-btn:focus-visible,.icon-btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.sess-hd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mq-group{margin-bottom:10px}.mq-qnum{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}.mq-parts{display:flex;flex-wrap:wrap;gap:6px}.mq-part{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--bg2)}.mq-part .mq-lab{color:var(--text2);font-weight:700}.mq-part.correct{background:var(--green-bg);border-color:transparent;color:var(--green)}.mq-part.wrong{background:var(--danger-bg);border-color:transparent;color:var(--danger-text)}.mq-part .mq-mark{font-weight:800}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}.main{padding:1rem .85rem 3rem}.bar-lbl{width:110px}}
</style>
</head>
<body>

<nav>
<a href="index.html" class="logo" style="text-decoration:none;display:inline-block;position:relative;padding-bottom:7px">
    <span style="font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:900;color:#0f0e0c;letter-spacing:-0.02em;line-height:1;white-space:nowrap">m<span style="position:relative;display:inline-block"><span style="position:absolute;top:2px;left:50%;transform:translateX(-50%);width:55%;height:2.5px;background:#0f0e0c;border-radius:1px"></span>a</span>ka</span>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 20" style="position:absolute;bottom:-3px;left:0;width:100%;height:20px;pointer-events:none">
  <defs><linearGradient id="fg_s1" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%" style="stop-color:#f0b429;stop-opacity:1"/>
    <stop offset="65%" style="stop-color:#d4a017;stop-opacity:0.65"/>
    <stop offset="100%" style="stop-color:#d4a017;stop-opacity:0.03"/>
  </linearGradient></defs>
  <path d="M 183 7 C 150 11, 90 15, 30 16 C 12 16, 2 14, 0 12" fill="none" stroke="url(#fg_s1)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 176 6 C 171 1, 164 0, 156 1" fill="none" stroke="#f0b429" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path d="M 162 8 C 156 3, 149 2, 141 3" fill="none" stroke="#f0b429" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>

<script>

// ── LOAD ALL DATA ─────────────────────────────────────────────────────────────
async function loadAll(){
  if(!STUDENT_ID){showErr('No student selected — go back to the Class tab and click a student.');return}

  var sr;
  try{sr=await sb.from('students').select('*').eq('id',STUDENT_ID).eq('teacher_id',USER.id).maybeSingle()}catch(e){sr={data:null}}
  if(!sr||!sr.data){showErr('Student not found. They may have been deleted.');return}
  STUDENT=sr.data;
  document.title='Māka — '+STUDENT.name;

  var firstName=STUDENT.name.split(' ')[0];
  var rr=null;
  // Prefer the proper student_id link; legacy rows without one fall back to the
  // old first-name match. If the student_id column doesn't exist yet (SQL not
  // run), retry with the old name-only query.
  try{
    rr=await sb.from('student_results').select('*, sessions(id,name,learning_area,task,created_at,level,rubric)').eq('teacher_id',USER.id)
      .or('student_id.eq.'+STUDENT_ID+',and(student_id.is.null,file_name.ilike.%'+firstName+'%)')
      .order('created_at',{ascending:true});
    if(rr.error)rr=null;
  }catch(e){rr=null}
  if(!rr){
    try{rr=await sb.from('student_results').select('*, sessions(id,name,learning_area,task,created_at,level,rubric)').eq('teacher_id',USER.id).ilike('file_name','%'+firstName+'%').order('created_at',{ascending:true})}catch(e){rr={data:[]}}
  }
  ALL_RESULTS=(rr&&rr.data)||[];

  var cr;
  try{cr=await sb.from('report_comments').select('*').eq('teacher_id',USER.id).eq('student_name',STUDENT.name).order('created_at',{ascending:false})}catch(e){cr={data:[]}}
  ALL_COMMENTS=(cr&&cr.data)||[];

  renderPage();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderPage(){
  var gL={boy:'He/him',girl:'She/her',nonbinary:'They/them'};
  var gC={boy:'background:var(--info-bg);color:var(--info-text)',girl:'background:#fce8f3;color:#8b1a5e',nonbinary:'background:var(--bg2);color:var(--text2)'};
  var gender=STUDENT.gender&&gL[STUDENT.gender]?'<span class="gender-chip" style="'+gC[STUDENT.gender]+'">'+gL[STUDENT.gender]+'</span>':'';

  var WR=ALL_RESULTS.filter(function(r){return r.mark_mode!=='maths'});
  CHARTSET=WR;
  MATSET=ALL_RESULTS.filter(isMaths);
  var totals=WR.map(function(r){return parseInt((r.criteria_total||'0').split('/')[0])||0});
  var avg=totals.length?(totals.reduce(function(a,b){return a+b},0)/totals.length).toFixed(1):'—';
  var best=totals.length?Math.max.apply(null,totals):'—';
  var latest=totals.length?totals[totals.length-1]:null;
  var prev=totals.length>1?totals[totals.length-2]:null;
  var trend=latest!==null&&prev!==null?latest-prev:null;
  var trendHtml=trend===null?'<span style="color:var(--text3);font-size:1.3rem">—</span>':trend>0?'<span class="delta d-up">↑ +'+trend+'</span>':trend<0?'<span class="delta d-dn">↓ '+trend+'</span>':'<span class="delta d-eq">→ 0</span>';

  var latestRes=WR.length?WR[WR.length-1]:null;
  var latestTot=latestRes?(parseInt((latestRes.criteria_total||'0').split('/')[0])||0):null;
  var latestGrade=latestRes?(latestRes.overall_score||''):'';
  var gradeMap={'Exceeds':'grade-exceeds','Achieved':'grade-achieved','Approaching':'grade-approaching','Beginning':'grade-beginning'};
  var gradeCls=gradeMap[latestGrade]||'grade-achieved';

  var heroHtml=latestRes
    ?'<div class="card hero-card">'
      +'<div class="hs-label">'+ic('award')+' Latest result</div>'
      +'<div class="hs-num">'+latestTot+'<span class="hs-den">/25</span></div>'
      +'<div class="hs-grade '+gradeCls+'">'+ic('trophy')+esc(latestGrade||'In progress')+'</div>'
      +'<div class="hs-sub">'+esc((latestRes.sessions&&latestRes.sessions.name)||'')+'</div>'
    +'</div>'
    :'<div class="card hero-card"><div class="empty" style="padding:1rem">'+ic('award')+'<div>No results yet</div></div></div>';

  document.getElementById('main').innerHTML=`
    <!-- IDENTITY -->
    <div class="page-head">
      <div class="ident">
        <div class="avatar-lg">${esc(STUDENT.name[0].toUpperCase())}</div>
        <div style="min-width:0">
          <h1 class="ident-name">${esc(STUDENT.name)}</h1>
          <div class="ident-meta">${STUDENT.year_level?esc(STUDENT.year_level):'<span style="color:var(--text3)">No year set</span>'} ${gender}${STUDENT.login_code?' <button class="copy-btn" style="font-family:monospace;letter-spacing:.04em" title="Student login code — click to copy" onclick="copyLoginCode(this)">'+esc(STUDENT.login_code)+'</button>':''}</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-sm" onclick="openEdit()">${ic('edit')} Edit</button>
        <button class="btn btn-sm" onclick="downloadReportPDF()">${ic('download')} Report PDF</button>
        <button class="btn btn-sm" id="share-btn" onclick="copyStudentLink()">${ic('link')} Copy student link</button>
        <button class="btn btn-sm btn-danger" onclick="deleteStudent()">${ic('trash')} Remove</button>
      </div>
    </div>

    <!-- TOP: hero + KPIs -->
    <div class="top-grid">
      ${heroHtml}
      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('layers')}</div></div><div class="stat-num">${ALL_RESULTS.length}</div><div class="stat-lbl">Sessions marked</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('chart')}</div></div><div class="stat-num">${avg}<span class="unit">${avg!=='—'?'/25':''}</span></div><div class="stat-lbl">Average score</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('trophy')}</div></div><div class="stat-num">${best}<span class="unit">${best!=='—'?'/25':''}</span></div><div class="stat-lbl">Best score</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('flame')}</div></div><div style="display:flex;align-items:center;min-height:1.85rem">${trendHtml}</div><div class="stat-lbl">Since last time</div></div>
      </div>
    </div>

    <!-- MIDDLE: chart + criterion bars -->
    <div class="mid-grid">
      <div class="card" id="chart-card">
        <div class="sect-title"><span class="ico-chip">${ic('chart')}</span>Progress over time
          ${CHARTSET.length<2?'':'<div class="chart-toggle" role="tablist"><button role="tab" id="ct-total" class="chart-tab active" onclick="setChartMode(\'total\')">Total</button><button role="tab" id="ct-crit" class="chart-tab" onclick="setChartMode(\'criteria\')">By criterion</button></div>'}
        </div>
        ${CHARTSET.length<2?'<div class="empty">'+ic('chart')+'<div>Mark at least 2 sessions to see the progress chart.</div></div>':'<div class="chart-wrap"><canvas id="progress-chart"></canvas></div><div id="chart-legend" class="chart-legend"></div>'}
      </div>

      <div class="card">
        <div class="sect-title"><span class="ico-chip">${ic('target')}</span>Average by criterion</div>
        <div id="crit-bars">${renderCritBars()}</div>
      </div>
    </div>

    ${MATSET.length?`<!-- MATHS TREND -->
    <div class="card">
      <div class="sect-title"><span class="ico-chip">${ic('chart')}</span>Maths over time <span style="font-size:12px;font-weight:400;color:var(--text2)">(% correct — separate from the /25 chart)</span><span class="count">${MATSET.length} set${MATSET.length!==1?'s':''}</span></div>
      ${MATSET.length<2?'<div class="empty">'+ic('chart')+'<div>Mark at least 2 maths sets to see the trend.</div></div>':'<div class="chart-wrap"><canvas id="maths-chart"></canvas></div>'}
    </div>`:''}

    <!-- SESSION HISTORY -->
    <div class="card">
      <div class="sect-title"><span class="ico-chip">${ic('layers')}</span>Session history<span class="count">${ALL_RESULTS.length} session${ALL_RESULTS.length!==1?'s':''}</span></div>
      <div id="session-list">${renderSessions()}</div>
    </div>

    <!-- REPORT COMMENTS -->
    <div class="card">
      <div class="sect-title"><span class="ico-chip">${ic('message')}</span>Report comments<span class="count">${ALL_COMMENTS.length} saved</span></div>
      <div id="comments-list">${renderComments()}</div>
    </div>

    <!-- REPORT GENERATOR -->
    <div class="card">
      <div class="sect-title"><span class="ico-chip">${ic('sparkle')}</span>Generate report comment</div>
      <p style="font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.55">Generates a full paragraph from all ${ALL_RESULTS.length} marking session${ALL_RESULTS.length!==1?'s':''} — in your saved writing style.</p>
      <div class="field"><label class="lbl">Gemini API key</label><div class="key-row"><input type="password" id="rep-key" placeholder="AIza…" autocomplete="off"><button class="eye-btn" aria-label="Show or hide key" onclick="var f=document.getElementById('rep-key');f.type=f.type=='password'?'text':'password'">${ic('eye')}</button></div></div>
      <div class="field"><label class="lbl">Term / context <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label><input type="text" id="rep-term" placeholder="e.g. End of Term 2, 2026"></div>
      <button class="btn btn-p" id="rep-btn" onclick="genReport()">${ic('sparkle')} Generate report comment</button>
      <div id="rep-output" class="rep-output"></div>
    </div>
  `;

  sb.from('profiles').select('gemini_key,writing_style').eq('id',USER.id).maybeSingle().then(function(res){
    if(res.data&&res.data.gemini_key)document.getElementById('rep-key').value=res.data.gemini_key;
  }).catch(function(){});

  if(CHARTSET.length>=2)setTimeout(drawChart,50);if(MATSET.length>=2)setTimeout(drawMathsLine,60);

  // Count-up stat numbers + bar fills
  setTimeout(function(){
    document.querySelectorAll('.stat-num').forEach(function(el){
      var m=el.textContent.match(/^(\d+(?:\.\d+)?)/);
      if(!m)return;
      var target=parseFloat(m[1]),isFloat=m[1].indexOf('.')!==-1;
      var t0=performance.now(),dur=700;
      var span=el.querySelector('span');
      el.innerHTML='';var tn=document.createTextNode('0');el.appendChild(tn);if(span)el.appendChild(span);
      function tick(now){
        var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
        var v=target*e;
        tn.textContent=(isFloat?v.toFixed(1):Math.round(v))+'';
        if(p<1)requestAnimationFrame(tick);else tn.textContent=m[1];
      }
      requestAnimationFrame(tick);
    });
    document.querySelectorAll('.bar-fill').forEach(function(el){var w=el.style.width;el.style.width='0';requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=w})})});
  },80);
}

// ── CRITERION BARS ────────────────────────────────────────────────────────────
function isMaths(r){return r.mark_mode==='maths'}
function mathPct(r){var qs=r.criteria||[];var t=qs.length,c=qs.filter(function(q){return q.correct}).length;return t?Math.round(100*c/t):0}
function renderCritBars(){
  var withCrit=ALL_RESULTS.filter(function(r){return !isMaths(r)&&r.criteria&&r.criteria.length});
  if(!withCrit.length)return'<div class="empty">'+ic('target')+'<div>No criterion data yet.</div></div>';
  var latest=withCrit[withCrit.length-1];
  var cn=latest.criteria.map(function(c){return c.name||''});
  return cn.map(function(name,ci){
    var vals=withCrit.filter(function(r){return r.criteria[ci]}).map(function(r){return parseInt(r.criteria[ci].score)||0});
    var a=vals.length?(vals.reduce(function(a,b){return a+b},0)/vals.length):0;
    var pct=Math.round(a/5*100);
    var col=pct>=70?'var(--green)':pct>=50?'var(--warn-text)':'var(--danger-text)';
    return'<div class="bar-row"><div class="bar-lbl" title="'+esc(name)+'">'+esc(name.split('—')[0].trim())+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div><div class="bar-val">'+a.toFixed(1)+'</div></div>';
  }).join('');
}

        +'<div style="min-width:0"><div class="sess-name">'+esc((r.sessions&&r.sessions.name)||'Session')+'</div><div class="sess-meta">'+(area?esc(area):'')+(date?(area?' · ':'')+date:'')+'</div></div>'
        +'<div style="display:flex;align-items:center;gap:10px"><span class="pill '+pillCls(pct)+'">'+esc(r.overall_score||'')+' · '+esc(r.criteria_total||'')+'</span><span class="chevron" id="chev-s'+i+'">'+ic('chevron')+'</span></div>'

// ── CHART ─────────────────────────────────────────────────────────────────────
var CHART_MODE='total';
var CRIT_COLORS=['#2d5a27','#c8840a','#185fa5','#8b1a5e','#5a564e','#1e7a6b','#a14d12'];
function setChartMode(m){
  CHART_MODE=m;
  var t=document.getElementById('ct-total'),c=document.getElementById('ct-crit');
  if(t)t.classList.toggle('active',m==='total');
  if(c)c.classList.toggle('active',m==='criteria');
  drawChart();
}
function isDark(){return document.documentElement.getAttribute('data-theme')==='dark'}
function drawChart(){
  var canvas=document.getElementById('progress-chart');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var wrap=canvas.parentElement;
  var W=wrap.clientWidth,H=210;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);

  var dark=isDark();
  var gridCol=dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)';
  var axisCol=dark?'rgba(236,233,227,0.5)':'rgba(0,0,0,0.4)';
  var dotFill=dark?'#1c1b19':'#fff';
  var labels=CHARTSET.map(function(r){return r.sessions&&r.sessions.name?(r.sessions.name.substring(0,20)):'Session'});

  var pad={t:20,r:20,b:50,l:40};
  var cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var n=CHARTSET.length;
  var xStep=n>1?cw/(n-1):cw;
  function xPos(i){return pad.l+(n>1?i*xStep:cw/2)}

  var legend=document.getElementById('chart-legend');

  if(CHART_MODE==='criteria'){
    var names=[];
    CHARTSET.forEach(function(r){(r.criteria||[]).forEach(function(c){var nm=(c.name||'').split('—')[0].trim();if(nm&&names.indexOf(nm)===-1)names.push(nm)})});
    if(!names.length){setChartMode('total');return}
    var maxV=5;
    function yPos(v){return pad.t+ch-(v/maxV)*ch}
    ctx.strokeStyle=gridCol;ctx.lineWidth=1;
    [0,1,2,3,4,5].forEach(function(v){var y=yPos(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText(v,pad.l-6,y+3)});
    names.forEach(function(nm,si){
      var col=CRIT_COLORS[si%CRIT_COLORS.length];
      var series=CHARTSET.map(function(r){var found=(r.criteria||[]).find(function(c){return(c.name||'').split('—')[0].trim()===nm});return found?(parseInt(found.score)||0):null});
      ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';
      var started=false;
      series.forEach(function(v,i){if(v===null)return;var x=xPos(i),y=yPos(v);started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true});
      ctx.stroke();
      series.forEach(function(v,i){if(v===null)return;var x=xPos(i),y=yPos(v);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fillStyle=dotFill;ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke()});
    });
    ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='center';
    CHARTSET.forEach(function(r,i){var lbl=labels[i];if(lbl.length>12)lbl=lbl.substring(0,12)+'…';ctx.save();ctx.translate(xPos(i),pad.t+ch+14);ctx.rotate(-0.4);ctx.fillText(lbl,0,0);ctx.restore()});
    if(legend)legend.innerHTML=names.map(function(nm,si){return'<span class="lg"><span class="sw" style="background:'+CRIT_COLORS[si%CRIT_COLORS.length]+'"></span>'+esc(nm)+'</span>'}).join('');
  }else{
    var data=CHARTSET.map(function(r){return parseInt((r.criteria_total||'0').split('/')[0])||0});
    var maxVal=25,green=dark?'#7fb87a':'#2d5a27';
    function yPosT(v){return pad.t+ch-(v/maxVal)*ch}
    ctx.strokeStyle=gridCol;ctx.lineWidth=1;
    [0,5,10,15,20,25].forEach(function(v){var y=yPosT(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText(v,pad.l-6,y+3)});
    ctx.beginPath();ctx.moveTo(xPos(0),yPosT(data[0]));data.forEach(function(v,i){if(i>0)ctx.lineTo(xPos(i),yPosT(v))});ctx.lineTo(xPos(n-1),pad.t+ch);ctx.lineTo(xPos(0),pad.t+ch);ctx.closePath();ctx.fillStyle=dark?'rgba(127,184,122,0.12)':'rgba(45,90,39,0.08)';ctx.fill();
    ctx.beginPath();ctx.strokeStyle=green;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';data.forEach(function(v,i){i===0?ctx.moveTo(xPos(i),yPosT(v)):ctx.lineTo(xPos(i),yPosT(v))});ctx.stroke();
    data.forEach(function(v,i){var x=xPos(i),y=yPosT(v);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=dotFill;ctx.fill();ctx.strokeStyle=green;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=green;ctx.font='bold 11px DM Sans,sans-serif';ctx.textAlign='center';ctx.fillText(v+'/25',x,y-10);ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';var lbl=labels[i];if(lbl.length>12)lbl=lbl.substring(0,12)+'…';ctx.save();ctx.translate(x,pad.t+ch+14);ctx.rotate(-0.4);ctx.fillText(lbl,0,0);ctx.restore()});
    if(legend)legend.innerHTML='';
  }
}

// ── PDF REPORT EXPORT (jsPDF) ────────────────────────────────────────────────
function downloadReportPDF(){
  try{
    var jsPDFns=window.jspdf||window.jsPDF;var JSP=jsPDFns&&(jsPDFns.jsPDF||jsPDFns);
    if(!JSP){alert('PDF library still loading — try again in a moment.');return}
    var doc=new JSP({unit:'pt',format:'a4'});
    var pw=doc.internal.pageSize.getWidth(),m=48,y=56;
    var gold=[200,132,10],ink=[26,26,26],grey=[107,107,107],green=[45,90,39];
    function line(){doc.setDrawColor(220,216,210);doc.line(m,y,pw-m,y);y+=18}
    function need(h){if(y+h>doc.internal.pageSize.getHeight()-48){doc.addPage();y=56}}
    doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(ink[0],ink[1],ink[2]);
    doc.text('Māka',m,y);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(grey[0],grey[1],grey[2]);
    doc.text('Student progress report',pw-m,y,{align:'right'});
    y+=10;line();
    doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(ink[0],ink[1],ink[2]);
    doc.text(STUDENT.name||'Student',m,y);y+=20;
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(grey[0],grey[1],grey[2]);
    var meta=[STUDENT.year_level||'',new Date().toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'})].filter(Boolean).join('  ·  ');
    doc.text(meta,m,y);y+=12;line();
    if(!ALL_RESULTS.length){doc.setFontSize(11);doc.text('No marking results yet.',m,y);doc.save((STUDENT.name||'student')+'-report.pdf');return}
    ALL_RESULTS.slice().reverse().forEach(function(r){
      need(110);
      doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(ink[0],ink[1],ink[2]);
      doc.text((r.sessions&&r.sessions.name)||'Session',m,y);
      doc.setTextColor(green[0],green[1],green[2]);
      doc.text((r.overall_score||'')+'   '+(r.criteria_total||''),pw-m,y,{align:'right'});
      y+=8;doc.setDrawColor(235,232,226);doc.line(m,y,pw-m,y);y+=16;
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(ink[0],ink[1],ink[2]);
      if(isMaths(r)){
        var qs=r.criteria||[],ok=qs.filter(function(q){return q.correct}).length;
        need(18);doc.setTextColor(grey[0],grey[1],grey[2]);
        doc.text(ok+' of '+qs.length+' correct ('+mathPct(r)+'%)',m+6,y);y+=15;
      }else{
        (r.criteria||[]).forEach(function(c){
          need(18);
          var nm=(c.name||'').split('—')[0].trim();
          doc.setTextColor(ink[0],ink[1],ink[2]);doc.text('•  '+nm,m+6,y);
          doc.setTextColor(grey[0],grey[1],grey[2]);doc.text((c.score||0)+'/5',pw-m,y,{align:'right'});
          y+=15;
        });
      }
      var tips=[r.strengths,(r.next_steps&&r.next_steps[0])].filter(Boolean);
      if(tips.length){
        y+=4;doc.setTextColor(gold[0],gold[1],gold[2]);doc.setFont('helvetica','bold');doc.setFontSize(9);
        need(16);doc.text('HOW TO IMPROVE',m+6,y);y+=13;
        doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(80,80,80);
        tips.forEach(function(t){var lines=doc.splitTextToSize('– '+t,pw-m*2-12);need(lines.length*13+4);doc.text(lines,m+6,y);y+=lines.length*13+2});
      }
      y+=14;
    });
    doc.save((STUDENT.name||'student').replace(/\s+/g,'-')+'-report.pdf');
  }catch(e){alert('Could not generate PDF: '+(e.message||e))}
}

var DEFAULT_STYLE="Ashton has demonstrated positive growth in his writing this term. He engaged enthusiastically with our unit on poetic forms, successfully using his creative mind to compose an excellent piece of poetry. Bennett has bravely embraced the challenge of improving his spelling and handwriting this term. Georgia has made pleasing progress in English this term, demonstrating a strong understanding of structure and form. Harper has continued to make excellent progress in English this term. Jessica has made noticeable progress in her writing this term.";

async function genReport(){
  var key=document.getElementById('rep-key').value.trim();
  if(!key){alert('Please enter your Gemini API key.');return}
  var term=document.getElementById('rep-term').value.trim();
  var btn=document.getElementById('rep-btn');
  var out=document.getElementById('rep-output');
  btn.disabled=true;btn.innerHTML='<span class="spinner" style="border-top-color:#fff"></span> Generating…';
  out.style.display='none';

  var style=DEFAULT_STYLE;
  try{var pr=await sb.from('profiles').select('writing_style').eq('id',USER.id).maybeSingle();if(pr.data&&pr.data.writing_style)style=pr.data.writing_style}catch(e){}

  var hist=ALL_RESULTS.length?ALL_RESULTS.map(function(r){
    var s=(r.sessions&&r.sessions.name)||'Session';
    var area=(r.sessions&&r.sessions.learning_area)||'';
    var tot=r.criteria_total||'';
    var ov=r.overall_score||'';
    var strengths=r.strengths||'';
    var ns=(r.next_steps||[]).join(', ');
    return s+(area?' ('+area+')':'')+': '+ov+' '+tot+(strengths?' — '+strengths:'')+(ns?' | Next: '+ns:'');
  }).join('\n'):'No prior marking results.';

  var pro={subject:'they',object:'them',possessive:'their'};
  if(STUDENT.gender==='boy')pro={subject:'he',object:'him',possessive:'his'};
  else if(STUDENT.gender==='girl')pro={subject:'she',object:'her',possessive:'her'};

  var prompt=[
    'Write a full school report comment for a NZ Years 7–8 student named '+STUDENT.name+'.',
    'Single paragraph, 4–6 sentences, third person.',
    'Use pronouns: '+pro.subject+'/'+pro.object+'/'+pro.possessive+'.',
    term?'Report context: '+term:'',
    'Match this teacher\'s writing style exactly:',
    style,'',
    'All marking history across '+ALL_RESULTS.length+' session'+(ALL_RESULTS.length!==1?'s':'')+':',
    hist,'',
    'Rules: use student name, third person, correct pronouns, reference specific growth, include one clear next step, 4–6 sentences. Return ONLY the paragraph text.'
  ].filter(Boolean).join('\n');

  try{
    var d=await(await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+key,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.4,maxOutputTokens:8192}})
    })).json();
    if(d.error)throw new Error(d.error.message||'Gemini error');
    var cand=(d.candidates||[])[0]||{};
    var ps=(cand.content&&cand.content.parts)||[];
    var text=ps.filter(function(p){return p.text&&!p.thought}).map(function(p){return p.text}).join('').trim();
    if(!text)throw new Error('Empty response from Gemini — please try again');
    if(cand.finishReason==='MAX_TOKENS')text+=' …';

    out.style.display='block';
    out.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px"><span style="font-size:12px;font-weight:600;color:var(--text2)">Report comment</span><button class="copy-btn" onclick="navigator.clipboard.writeText(this.dataset.t).then(function(){this.textContent=\'Copied!\';setTimeout(function(){document.querySelector(\'.copy-btn[data-t]\').textContent=\'Copy\'},1500)}.bind(this))" data-t="'+esc(text)+'">Copy</button></div><div style="font-size:13.5px;line-height:1.8">'+esc(text)+'</div>';

    var label=(term||'Report')+' — '+new Date().toLocaleDateString('en-NZ');
    sb.from('report_comments').insert({
      teacher_id:USER.id,
      student_name:STUDENT.name,
      comment_text:text,
      label:label
    }).then(function(){
      ALL_COMMENTS.unshift({comment_text:text,label:label,created_at:new Date().toISOString()});
      document.getElementById('comments-list').innerHTML=renderComments();
      document.querySelectorAll('.copy-btn[data-t]').forEach(function(b){b.onclick=function(){navigator.clipboard.writeText(b.dataset.t).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy'},1500)})}});
    }).catch(function(){});

  }catch(e){
    out.style.display='block';
    out.innerHTML='<div class="err">'+esc(e.message)+'</div>';
  }

  btn.disabled=false;btn.innerHTML=ic('sparkle')+' Generate report comment';
}

async function copyStudentLink(){

  try{
    var r=await sb.from('students').select('share_code,login_code').eq('id',STUDENT.id).maybeSingle();
    var code=r&&r.data?(r.data.login_code||r.data.share_code):null;

      // Generate one client-side if the column exists but is empty
      code=btoa(String.fromCharCode.apply(null,crypto.getRandomValues(new Uint8Array(12)))).replace(/\//g,'x').replace(/\+/g,'y');
      var u=await sb.from('students').update({share_code:code}).eq('id',STUDENT.id);
      if(u.error)throw new Error('Run the student hub SQL setup first (supabase-student-hub.sql).');
    }
    var link=location.origin+location.pathname.replace(/[^/]*$/,'')+'myhub.html?c='+encodeURIComponent(code);
    await navigator.clipboard.writeText(link);
    if(btn){var old=btn.innerHTML;btn.innerHTML=ic('link')+' Copied!';setTimeout(function(){btn.innerHTML=old},1800)}
  }catch(e){alert('Could not create the link: '+e.message)}
}
function deleteStudent(){
  if(!confirm('Remove '+STUDENT.name+' from your class list? Their marking history will be kept.'))return;
  sb.from('students').delete().eq('id',STUDENT.id).then(function(){window.location.href='tool.html'}).catch(function(e){alert(e.message)});
}

function initSupabase(){
  try{
    sb=supabase.createClient(SURL,SKEY);
    if(!_TEACHER_ID||!STUDENT_ID){
      document.getElementById('main').innerHTML='<div style="max-width:860px;margin:2rem auto"><div class="card" style="text-align:center;padding:2rem"><p style="color:var(--text2);margin-bottom:1rem">Please open the student hub from the Class tab in Māka.</p><a href="tool.html" class="btn btn-p">← Back to Māka</a></div></div>';
      return;
    }
    USER={id:_TEACHER_ID};
    loadAll();
  }catch(e){showErr('Failed to initialise: '+e.message)}
}
initSupabase();
(function(){var nv=document.querySelector('nav');if(!nv)return;window.addEventListener('scroll',function(){nv.classList.toggle('scrolled',window.scrollY>4)},{passive:true})})();
function drawMathsLine(){
  var canvas=document.getElementById('maths-chart');if(!canvas)return;
  var ctx=canvas.getContext('2d'),wrap=canvas.parentElement,W=wrap.clientWidth,H=210;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,W,H);
  var dark=isDark(),gridCol=dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)',axisCol=dark?'rgba(236,233,227,0.5)':'rgba(0,0,0,0.4)',dotFill=dark?'#1c1b19':'#fff',green=dark?'#7fb87a':'#2d5a27';
  var labels=MATSET.map(function(r){return r.sessions&&r.sessions.name?r.sessions.name.substring(0,20):'Maths'});
  var data=MATSET.map(mathPct);
  var pad={t:20,r:20,b:50,l:42},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,n=MATSET.length;
  var xStep=n>1?cw/(n-1):cw;function xPos(i){return pad.l+(n>1?i*xStep:cw/2)}
  function yPos(v){return pad.t+ch-(v/100)*ch}
  ctx.strokeStyle=gridCol;ctx.lineWidth=1;
  [0,25,50,75,100].forEach(function(v){var y=yPos(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText(v+'%',pad.l-6,y+3)});
  ctx.beginPath();ctx.moveTo(xPos(0),yPos(data[0]));data.forEach(function(v,i){if(i>0)ctx.lineTo(xPos(i),yPos(v))});ctx.lineTo(xPos(n-1),pad.t+ch);ctx.lineTo(xPos(0),pad.t+ch);ctx.closePath();ctx.fillStyle=dark?'rgba(127,184,122,0.12)':'rgba(45,90,39,0.08)';ctx.fill();
  ctx.beginPath();ctx.strokeStyle=green;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';data.forEach(function(v,i){i===0?ctx.moveTo(xPos(i),yPos(v)):ctx.lineTo(xPos(i),yPos(v))});ctx.stroke();
  data.forEach(function(v,i){var x=xPos(i),y=yPos(v);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=dotFill;ctx.fill();ctx.strokeStyle=green;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=green;ctx.font='bold 11px DM Sans,sans-serif';ctx.textAlign='center';ctx.fillText(v+'%',x,y-10);ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';var lbl=labels[i];if(lbl.length>12)lbl=lbl.substring(0,12)+'…';ctx.save();ctx.translate(x,pad.t+ch+14);ctx.rotate(-0.4);ctx.fillText(lbl,0,0);ctx.restore()});
}

window.addEventListener('resize',function(){if(CHARTSET.length>=2)drawChart();if(MATSET.length>=2)drawMathsLine()});
</script>
