<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Māka — My Marks</title>
<script>
(function(){try{
  var t=localStorage.getItem('maka-theme');
  if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f6f3;--bg3:#f5f0e8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.16);
  --green:#2d5a27;--green-bg:#e8f0e6;
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --danger-bg:#fcebeb;--danger-text:#a32d2d;
  --info-bg:#e6f1fb;--info-text:#185fa5;
  --gold:#c8840a;--gold-soft:rgba(200,132,10,0.12);
  --r:12px;--rs:8px;--r-lg:18px;
  --nav-bg:rgba(245,240,232,0.72);--scrim:rgba(0,0,0,0.4);
  --sh-sm:0 1px 2px rgba(15,14,12,0.04),0 1px 3px rgba(15,14,12,0.04);
  --sh-md:0 8px 28px -10px rgba(15,14,12,0.12);
  --sh-lg:0 20px 50px -16px rgba(15,14,12,0.2);
  --ease:cubic-bezier(.25,.8,.25,1);--ease-spring:cubic-bezier(.16,1,.3,1)}
[data-theme="dark"]{
  --bg:#1c1b19;--bg2:#242220;--bg3:#161513;
  --text:#ece9e3;--text2:#a9a49b;--text3:#7d7972;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --green:#7fb87a;--green-bg:#23302180;
  --warn-bg:#3a2e1a;--warn-text:#e0b878;
  --danger-bg:#3a2020;--danger-text:#e89a9a;
  --info-bg:#1d2c3a;--info-text:#7fb0e0;
  --gold:#e0a52a;--gold-soft:rgba(224,165,42,0.16);
  --nav-bg:rgba(22,21,19,0.78);--scrim:rgba(0,0,0,0.6);
  --sh-md:0 8px 28px -10px rgba(0,0,0,0.5);--sh-lg:0 24px 60px -18px rgba(0,0,0,0.6);--sh-sm:0 1px 2px rgba(0,0,0,0.3)}
[data-theme="dark"] .logo>span{color:#ece9e3!important}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:800;color:#0f0e0c;text-decoration:none;letter-spacing:-.02em}
.logo span{color:var(--green)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s var(--ease),color .2s var(--ease)}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.main{max-width:1060px;margin:0 auto;padding:1.75rem 1.25rem 4rem}
.top-grid{display:grid;grid-template-columns:minmax(280px,1fr) 1.25fr;gap:1rem;margin-bottom:1rem}
.mid-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:840px){.top-grid,.mid-grid{grid-template-columns:1fr}}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;box-shadow:var(--sh-sm);animation:riseIn .5s var(--ease-spring) backwards}
.mid-grid .card,.top-grid .card{margin-bottom:0}
.sect-title{font-weight:600;font-size:14px;margin-bottom:1.1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sect-title .ico-chip{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);flex-shrink:0}
.sect-title .count{margin-left:auto;font-size:12px;font-weight:400;color:var(--text2)}
.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:1.25rem}
.ident{display:flex;align-items:center;gap:14px;min-width:0}
.avatar-lg{width:56px;height:56px;border-radius:18px;background:linear-gradient(140deg,var(--green) 0%,#3f7a37 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:800;font-size:26px;flex-shrink:0;box-shadow:var(--sh-md)}
.ident-name{font-family:'Fraunces',serif;font-size:clamp(1.5rem,4vw,1.9rem);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.ident-meta{font-size:13px;color:var(--text2);margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;text-decoration:none;transition:background .2s var(--ease)}
.btn:hover{background:var(--bg2)}
.pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ph{background:var(--green-bg);color:var(--green)}.pm{background:var(--warn-bg);color:var(--warn-text)}.pl{background:var(--danger-bg);color:var(--danger-text)}
.hero-card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem 1.5rem;background:radial-gradient(120% 120% at 50% -10%,var(--gold-soft) 0%,transparent 55%),var(--bg)}
.hs-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hs-num{font-family:'Fraunces',serif;font-size:clamp(3.4rem,11vw,4.6rem);font-weight:800;line-height:.9;color:var(--text);font-variant-numeric:tabular-nums}
.hs-den{font-size:.3em;font-weight:600;color:var(--text3);letter-spacing:-.02em}
.hs-grade{display:inline-flex;align-items:center;gap:6px;margin-top:1rem;font-size:13.5px;font-weight:600;padding:8px 20px;border-radius:100px}
.grade-exceeds{background:rgba(200,132,10,0.14);color:#9c6500}
[data-theme="dark"] .grade-exceeds{color:var(--gold)}
.grade-achieved{background:var(--green-bg);color:var(--green)}
.grade-approaching{background:var(--warn-bg);color:var(--warn-text)}
.grade-beginning{background:var(--danger-bg);color:var(--danger-text)}
.hs-sub{font-size:12.5px;color:var(--text2);margin-top:12px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.kpi{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;box-shadow:var(--sh-sm);animation:riseIn .5s var(--ease-spring) backwards}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-ico{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2)}
.stat-num{font-family:'Fraunces',serif;font-size:1.85rem;font-weight:800;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.stat-num .unit{font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;color:var(--text3)}
.stat-lbl{font-size:11.5px;color:var(--text2);margin-top:6px}
.chart-wrap{position:relative;height:210px;margin-top:6px}
canvas{width:100%!important}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{width:150px;font-size:12.5px;color:var(--text);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:9px;background:var(--bg2);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;width:0;transition:width 1s var(--ease-spring)}
.bar-val{width:42px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.sess-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:.7rem}
.sess-card:last-child{margin-bottom:0}
.sess-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;cursor:pointer}
.sess-name{font-weight:600;font-size:14px}
.sess-meta{font-size:12px;color:var(--text2);margin-top:3px}
.sess-body{max-height:0;opacity:0;overflow:hidden;transition:max-height .45s var(--ease-spring),opacity .3s var(--ease),margin .3s var(--ease)}
.sess-body.open{max-height:2400px;opacity:1;margin-top:14px}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;table-layout:fixed}
.ctable th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);padding:4px 0 7px;border-bottom:1px solid var(--border)}
.ctable td{padding:8px 4px 8px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.ctable tr:last-child td{border-bottom:none}
.ctable .cn{width:55%;color:var(--text)}.ctable .cs{width:45%}
.total-row{font-size:13px;color:var(--text2);margin-bottom:4px}
.total-row strong{color:var(--text);font-variant-numeric:tabular-nums}
.slbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:14px 0 6px}
.sbox{font-size:13px;color:var(--text2);line-height:1.6;padding:11px 13px;background:var(--bg);border-radius:var(--rs)}
.sbox.improve{background:var(--gold-soft);border-left:3px solid var(--gold);color:var(--text);display:flex;gap:9px;align-items:flex-start}
.sbox.improve .ico{font-size:15px;color:var(--gold);margin-top:1px}
.sbox.praise{background:var(--green-bg);border-left:3px solid var(--green);color:var(--text);display:flex;gap:9px;align-items:flex-start}
.sbox.praise .ico{font-size:15px;color:var(--green);margin-top:1px}
.ctable .ccomment{font-size:11.5px;color:var(--text2);line-height:1.45;margin-top:3px}
.sbox .quote{font-style:italic;color:var(--text2);border-left:2px solid var(--border2);padding:2px 0 2px 9px;margin-bottom:6px;font-size:12.5px;line-height:1.5}
.sbox .quote::before{content:'\201C'}.sbox .quote::after{content:'\201D'}
.sbox .tryex{margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--text);background:rgba(0,0,0,0.03);border-radius:6px;padding:6px 9px}
[data-theme="dark"] .sbox .tryex{background:rgba(255,255,255,0.05)}
.sbox .trylbl{font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;font-size:10px;margin-right:5px}
.chevron{color:var(--text3);transition:transform .35s var(--ease-spring);flex-shrink:0;display:inline-flex;font-size:18px}
.chevron.open{transform:rotate(90deg)}
.err{font-size:13px;color:var(--danger-text);background:var(--danger-bg);padding:11px 13px;border-radius:var(--rs);line-height:1.5}
.empty{text-align:center;padding:2.5rem 1.5rem;color:var(--text2);font-size:13.5px;line-height:1.6}
.empty .ico{font-size:26px;color:var(--text3);margin-bottom:10px}
.spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.delta{font-size:13px;font-weight:700;padding:3px 10px;border-radius:100px;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.d-up{background:var(--green-bg);color:var(--green)}.d-dn{background:var(--danger-bg);color:var(--danger-text)}.d-eq{background:var(--bg2);color:var(--text3)}
.btn:focus-visible,.icon-btn:focus-visible,a:focus-visible,.sess-hd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}.main{padding:1rem .85rem 3rem}.bar-lbl{width:110px}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo" style="text-decoration:none">m<span>a</span>ka</a>
  <div style="display:flex;align-items:center;gap:10px">
    <button id="theme-btn" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
    <a href="#" id="logout-link" class="btn" style="padding:7px 13px;font-size:12.5px">Log out</a>
  </div>
</nav>

<div class="main" id="main">
  <div style="text-align:center;padding:4rem 1rem;color:var(--text2)">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px">
      <div class="spinner"></div>Loading…
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL='https://agwqenhduoxxeemklmpr.supabase.co';
var SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnd3FlbmhkdW94eGVlbWtsbXByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MzkxNDAsImV4cCI6MjA5NDAxNTE0MH0.TZkrRgForSDTzQ4vZ9j36WncEAVBx4reG-ADcoohY8o';
var sb=window.supabase.createClient(SURL,SKEY);

var STUDENT=null,ALL_RESULTS=[],CHART_MODE='total';

var ICONS={
  award:'<circle cx="12" cy="8" r="6"/><path d="M8.2 13.4 7 22l5-3 5 3-1.2-8.6"/>',
  layers:'<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-9"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  trophy:'<path d="M6 9a6 6 0 0 0 12 0V3H6Z"/><path d="M6 5H3v2a3 3 0 0 0 3 3"/><path d="M18 5h3v2a3 3 0 0 1-3 3"/><path d="M9 21h6"/><path d="M12 17v4"/>',
  flame:'<path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 1-2.5C9 9 8 11 8 13a4 4 0 0 0 8 0c0-4-4-8-4-11Z"/>',
  bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/>',
  chevron:'<path d="M9 18l6-6-6-6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>'
};
function ic(name){return'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||'')+'</svg>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
// Feedback is stored as folded text; parse it back so the student's own words show as a quote.
function parsePraise(s){s=String(s||'');var m=s.match(/^“([^”]*)”\s*—\s*([\s\S]*)$/);return m?{quote:m[1],text:m[2].trim()}:{quote:'',text:s}}
function parseTip(s){s=String(s||'');var quote='',body=s;var m=s.match(/^You wrote “([^”]*)”\.\s*([\s\S]*)$/);if(m){quote=m[1];body=m[2]}var ex='',em=body.match(/\s*Try:\s*“([^”]*)”\s*$/);if(em){ex=em[1];body=body.slice(0,em.index)}return{quote:quote,text:body.trim(),example:ex}}
function fmtDate(d){return new Date(d).toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}
function pillCls(pct){return pct>=75?'ph':pct>=50?'pm':'pl'}
function dots(sc){var h='';for(var i=1;i<=5;i++)h+='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;background:'+(i<=sc?'var(--green)':'var(--border2)')+'"></span>';return h+'<span style="font-size:11px;color:var(--text2);margin-left:3px;font-variant-numeric:tabular-nums">'+sc+'/5</span>'}
function showErr(msg){document.getElementById('main').innerHTML='<div class="card" style="max-width:860px;margin:2rem auto"><div class="err">'+esc(msg)+'</div><div style="margin-top:1rem"><a href="student-login.html" class="btn">← Back to login</a></div></div>'}
function applyThemeLabel(){var b=document.getElementById('theme-btn');if(!b)return;b.innerHTML=document.documentElement.getAttribute('data-theme')==='dark'?ic('sun'):ic('moon')}
function toggleTheme(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark){document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('maka-theme','light')}catch(e){}}
  else{document.documentElement.setAttribute('data-theme','dark');try{localStorage.setItem('maka-theme','dark')}catch(e){}}
  applyThemeLabel();if(ALL_RESULTS.length>=2)setTimeout(drawChart,30);
}
window.addEventListener('DOMContentLoaded',applyThemeLabel);
document.getElementById('logout-link').addEventListener('click',function(e){
  e.preventDefault();try{sessionStorage.removeItem('maka-student-code')}catch(err){}window.location.href='student-login.html';
});

async function loadAll(){
  var code;
  try{code=sessionStorage.getItem('maka-student-code')}catch(e){code=null}
  if(!code){window.location.href='student-login.html';return}

  var res;
  try{res=await sb.rpc('get_student_portal',{p_access_code:code})}catch(e){showErr('Could not load your marks. Please try logging in again.');return}
  if(res.error||!res.data||res.data.error){
    try{sessionStorage.removeItem('maka-student-code')}catch(e){}
    showErr('Your login code is no longer valid. Please log in again.');
    return;
  }

  STUDENT=res.data.student;
  document.title='Māka — '+STUDENT.name;
  ALL_RESULTS=(res.data.results||[]).map(function(r){
    return{
      overall_score:r.overall_score,criteria_total:r.criteria_total,criteria:r.criteria,
      strengths:r.strengths,next_steps:r.next_steps,
      sessions:{name:r.session_name,learning_area:r.learning_area,task:r.task,created_at:r.session_created_at}
    };
  });
  renderPage();
}

function renderPage(){
  var totals=ALL_RESULTS.map(function(r){return parseInt((r.criteria_total||'0').split('/')[0])||0});
  var avg=totals.length?(totals.reduce(function(a,b){return a+b},0)/totals.length).toFixed(1):'—';
  var best=totals.length?Math.max.apply(null,totals):'—';
  var latest=totals.length?totals[totals.length-1]:null;
  var prev=totals.length>1?totals[totals.length-2]:null;
  var trend=latest!==null&&prev!==null?latest-prev:null;
  var trendHtml=trend===null?'<span style="color:var(--text3);font-size:1.3rem">—</span>':trend>0?'<span class="delta d-up">↑ +'+trend+'</span>':trend<0?'<span class="delta d-dn">↓ '+trend+'</span>':'<span class="delta d-eq">→ 0</span>';

  var latestRes=ALL_RESULTS.length?ALL_RESULTS[ALL_RESULTS.length-1]:null;
  var latestTot=latestRes?(parseInt((latestRes.criteria_total||'0').split('/')[0])||0):null;
  var latestGrade=latestRes?(latestRes.overall_score||''):'';
  var gradeMap={'Exceeds':'grade-exceeds','Achieved':'grade-achieved','Approaching':'grade-approaching','Beginning':'grade-beginning'};
  var gradeCls=gradeMap[latestGrade]||'grade-achieved';

  var heroHtml=latestRes
    ?'<div class="card hero-card">'
      +'<div class="hs-label">'+ic('award')+' Latest result</div>'
      +'<div class="hs-num">'+latestTot+'<span class="hs-den">/25</span></div>'
      +'<div class="hs-grade '+gradeCls+'">'+ic('trophy')+esc(latestGrade||'In progress')+'</div>'
      +'<div class="hs-sub">'+esc((latestRes.sessions&&latestRes.sessions.name)||'')+'</div>'
    +'</div>'
    :'<div class="card hero-card"><div class="empty" style="padding:1rem">'+ic('award')+'<div>No results yet — check back after your teacher marks your work.</div></div></div>';

  document.getElementById('main').innerHTML=`
    <div class="page-head">
      <div class="ident">
        <div class="avatar-lg">${esc(STUDENT.name[0].toUpperCase())}</div>
        <div style="min-width:0">
          <h1 class="ident-name">${esc(STUDENT.name)}</h1>
          <div class="ident-meta">${STUDENT.year_level?esc(STUDENT.year_level):''}</div>
        </div>
      </div>
    </div>

    <div class="top-grid">
      ${heroHtml}
      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('layers')}</div></div><div class="stat-num">${ALL_RESULTS.length}</div><div class="stat-lbl">Sessions marked</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('chart')}</div></div><div class="stat-num">${avg}<span class="unit">${avg!=='—'?'/25':''}</span></div><div class="stat-lbl">Average score</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('trophy')}</div></div><div class="stat-num">${best}<span class="unit">${best!=='—'?'/25':''}</span></div><div class="stat-lbl">Best score</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ico">${ic('flame')}</div></div><div style="display:flex;align-items:center;min-height:1.85rem">${trendHtml}</div><div class="stat-lbl">Since last time</div></div>
      </div>
    </div>

    <div class="mid-grid">
      <div class="card" id="chart-card">
        <div class="sect-title"><span class="ico-chip">${ic('chart')}</span>Progress over time</div>
        ${ALL_RESULTS.length<2?'<div class="empty">'+ic('chart')+'<div>Mark at least 2 sessions to see your progress chart.</div></div>':'<div class="chart-wrap"><canvas id="progress-chart"></canvas></div>'}
      </div>
      <div class="card">
        <div class="sect-title"><span class="ico-chip">${ic('target')}</span>Average by criterion</div>
        <div id="crit-bars">${renderCritBars()}</div>
      </div>
    </div>

    <div class="card">
      <div class="sect-title"><span class="ico-chip">${ic('layers')}</span>Session history<span class="count">${ALL_RESULTS.length} session${ALL_RESULTS.length!==1?'s':''}</span></div>
      <div id="session-list">${renderSessions()}</div>
    </div>
  `;

  if(ALL_RESULTS.length>=2)setTimeout(drawChart,50);

  setTimeout(function(){
    document.querySelectorAll('.stat-num').forEach(function(el){
      var m=el.textContent.match(/^(\d+(?:\.\d+)?)/);
      if(!m)return;
      var target=parseFloat(m[1]),isFloat=m[1].indexOf('.')!==-1;
      var t0=performance.now(),dur=700;
      var span=el.querySelector('span');
      el.innerHTML='';var tn=document.createTextNode('0');el.appendChild(tn);if(span)el.appendChild(span);
      function tick(now){
        var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
        var v=target*e;
        tn.textContent=(isFloat?v.toFixed(1):Math.round(v))+'';
        if(p<1)requestAnimationFrame(tick);else tn.textContent=m[1];
      }
      requestAnimationFrame(tick);
    });
    document.querySelectorAll('.bar-fill').forEach(function(el){var w=el.style.width;el.style.width='0';requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=w})})});
  },80);
}

function renderCritBars(){
  var withCrit=ALL_RESULTS.filter(function(r){return r.criteria&&r.criteria.length});
  if(!withCrit.length)return'<div class="empty">'+ic('target')+'<div>No criterion data yet.</div></div>';
  var latest=withCrit[withCrit.length-1];
  var cn=latest.criteria.map(function(c){return c.name||''});
  return cn.map(function(name,ci){
    var vals=withCrit.filter(function(r){return r.criteria[ci]}).map(function(r){return parseInt(r.criteria[ci].score)||0});
    var a=vals.length?(vals.reduce(function(a,b){return a+b},0)/vals.length):0;
    var pct=Math.round(a/5*100);
    var col=pct>=70?'var(--green)':pct>=50?'var(--warn-text)':'var(--danger-text)';
    return'<div class="bar-row"><div class="bar-lbl" title="'+esc(name)+'">'+esc(name.split('—')[0].trim())+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div>'+sparkline(vals,col)+'<div class="bar-val">'+a.toFixed(1)+'</div></div>';
  }).join('');
}
function sparkline(vals,col){
  if(!vals||vals.length<2)return'<span style="width:52px;flex-shrink:0" aria-hidden="true"></span>';
  var w=52,h=18,pad=2,n=vals.length;
  var pts=vals.map(function(v,i){var x=pad+(n>1?i/(n-1):0)*(w-pad*2);var y=h-pad-((v)/5)*(h-pad*2);return x.toFixed(1)+','+y.toFixed(1)});
  var last=vals[vals.length-1],lx=(w-pad).toFixed(1),ly=(h-pad-(last/5)*(h-pad*2)).toFixed(1);
  var trend=vals[vals.length-1]-vals[0];
  return'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="flex-shrink:0;overflow:visible" role="img" aria-label="Trend: '+(trend>0?'up':trend<0?'down':'flat')+'"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+lx+'" cy="'+ly+'" r="2.1" fill="'+col+'"/></svg>';
}

function renderSessions(){
  if(!ALL_RESULTS.length)return'<div class="empty">'+ic('layers')+'<div>No sessions yet. Check back after your teacher marks your work.</div></div>';
  return ALL_RESULTS.slice().reverse().map(function(r,i){
    var tot=parseInt((r.criteria_total||'0').split('/')[0])||0;
    var pct=Math.round(tot/25*100);
    var crit=r.criteria||[];
    var critRows=crit.map(function(c){var cm=c.comment?'<div class="ccomment">'+esc(c.comment)+'</div>':'';return'<tr><td class="cn">'+esc(c.name||'')+cm+'</td><td class="cs" style="vertical-align:top">'+dots(parseInt(c.score)||0)+'</td></tr>'}).join('');
    var praise=r.strengths||'';
    var tips=(r.next_steps&&r.next_steps.length)?r.next_steps:[];
    var date=r.sessions&&r.sessions.created_at?fmtDate(r.sessions.created_at):'';
    var area=r.sessions&&r.sessions.learning_area?r.sessions.learning_area:'';
    return'<div class="sess-card">'
      +'<div class="sess-hd" tabindex="0" role="button" aria-expanded="false" onclick="toggleSess(\'s'+i+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleSess(\'s'+i+'\')}">'
        +'<div style="min-width:0"><div class="sess-name">'+esc((r.sessions&&r.sessions.name)||'Session')+'</div><div class="sess-meta">'+(area?esc(area):'')+(date?(area?' · ':'')+date:'')+'</div></div>'
        +'<div style="display:flex;align-items:center;gap:10px"><span class="pill '+pillCls(pct)+'">'+esc(r.overall_score||'')+' · '+esc(r.criteria_total||'')+'</span><span class="chevron" id="chev-s'+i+'">'+ic('chevron')+'</span></div>'
      +'</div>'
      +'<div class="sess-body" id="s'+i+'">'
        +(critRows?'<table class="ctable"><thead><tr><th>Criterion</th><th>Score</th></tr></thead><tbody>'+critRows+'</tbody></table>':'')
        +'<div class="total-row">Total: <strong>'+esc(r.criteria_total||'')+'</strong></div>'
        +(praise?(function(){var p=parsePraise(praise);return'<div class="slbl">What you did well</div><div class="sbox praise">'+ic('award')+'<div>'+(p.quote?'<div class="quote">'+esc(p.quote)+'</div>':'')+'<span>'+esc(p.text)+'</span></div></div>'})():'')
        +(tips.length?'<div class="slbl" style="margin-top:12px">How to improve</div>'+tips.map(function(t){var pt=parseTip(t);var h='<div class="sbox improve" style="margin-bottom:6px">'+ic('bulb')+'<div>';if(pt.quote)h+='<div class="quote">'+esc(pt.quote)+'</div>';h+='<span>'+esc(pt.text)+'</span>';if(pt.example)h+='<div class="tryex"><span class="trylbl">Try</span> '+esc(pt.example)+'</div>';return h+'</div></div>'}).join(''):'')
      +'</div>'
    +'</div>';
  }).join('');
}
function toggleSess(id){
  var body=document.getElementById(id);
  var chev=document.getElementById('chev-'+id);
  if(!body)return;
  var open=body.classList.toggle('open');
  if(chev)chev.classList.toggle('open',open);
  var hd=body.previousElementSibling;if(hd&&hd.setAttribute)hd.setAttribute('aria-expanded',open?'true':'false');
}

function isDark(){return document.documentElement.getAttribute('data-theme')==='dark'}
function drawChart(){
  var canvas=document.getElementById('progress-chart');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var wrap=canvas.parentElement;
  var W=wrap.clientWidth,H=210;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);

  var dark=isDark();
  var gridCol=dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)';
  var axisCol=dark?'rgba(236,233,227,0.5)':'rgba(0,0,0,0.4)';
  var dotFill=dark?'#1c1b19':'#fff';
  var lineCol=dark?'#7fb87a':'#2d5a27';
  var totals=ALL_RESULTS.map(function(r){return parseInt((r.criteria_total||'0').split('/')[0])||0});
  var n=totals.length;

  var pad={t:20,r:20,b:30,l:36};
  var cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var xStep=n>1?cw/(n-1):cw;
  function xPos(i){return pad.l+(n>1?i*xStep:cw/2)}
  function yPos(v){return pad.t+ch-(v/25)*ch}

  ctx.strokeStyle=gridCol;ctx.lineWidth=1;
  for(var g=0;g<=5;g++){var gy=pad.t+ch*g/5;ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);ctx.stroke()}

  ctx.beginPath();ctx.strokeStyle=lineCol;ctx.lineWidth=2.2;
  totals.forEach(function(v,i){var x=xPos(i),y=yPos(v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});
  ctx.stroke();

  totals.forEach(function(v,i){
    var x=xPos(i),y=yPos(v);
    ctx.beginPath();ctx.fillStyle=dotFill;ctx.strokeStyle=lineCol;ctx.lineWidth=2;
    ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.stroke();
  });

  ctx.fillStyle=axisCol;ctx.font='11px DM Sans, sans-serif';ctx.textAlign='center';
  totals.forEach(function(v,i){ctx.fillText('S'+(i+1),xPos(i),H-8)});
}

loadAll();
</script>
</body>
</html>
