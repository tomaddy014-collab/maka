[build]
  base    = "meal-planner"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Frame extraction sends ~10 images to Claude, which takes longer than the
# 10s default. Netlify caps this at 10s on Free and 26s on paid plans; if
# imports time out on Free, that is the limit being hit, not a bug.
[functions."extract-recipe"]
  timeout = 26
