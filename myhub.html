}catch(e){}})();

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f6f3;--bg3:#f5f0e8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.16);
  --green:#2d5a27;--green-bg:#e8f0e6;
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --danger-bg:#fcebeb;--danger-text:#a32d2d;
  --info-bg:#e6f1fb;--info-text:#185fa5;
  --gold:#c8840a;--gold-soft:rgba(200,132,10,0.12);
  --r:12px;--rs:8px;--r-lg:18px;
  --nav-bg:rgba(245,240,232,0.72);--scrim:rgba(0,0,0,0.4);
  --sh-sm:0 1px 2px rgba(15,14,12,0.04),0 1px 3px rgba(15,14,12,0.04);
  --sh-md:0 8px 28px -10px rgba(15,14,12,0.12);
  --sh-lg:0 20px 50px -16px rgba(15,14,12,0.2);
  --ease:cubic-bezier(.25,.8,.25,1);--ease-spring:cubic-bezier(.16,1,.3,1)}
[data-theme="dark"]{
  --bg:#1c1b19;--bg2:#242220;--bg3:#161513;
  --text:#ece9e3;--text2:#a9a49b;--text3:#7d7972;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --green:#7fb87a;--green-bg:#23302180;
  --warn-bg:#3a2e1a;--warn-text:#e0b878;
  --danger-bg:#3a2020;--danger-text:#e89a9a;
  --info-bg:#1d2c3a;--info-text:#7fb0e0;
  --gold:#e0a52a;--gold-soft:rgba(224,165,42,0.16);
  --nav-bg:rgba(22,21,19,0.78);--scrim:rgba(0,0,0,0.6);
  --sh-md:0 8px 28px -10px rgba(0,0,0,0.5);--sh-lg:0 24px 60px -18px rgba(0,0,0,0.6);--sh-sm:0 1px 2px rgba(0,0,0,0.3)}
[data-theme="dark"] .logo>span{color:#ece9e3!important}
[data-theme="dark"] .logo span span span{background:#ece9e3!important}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:800;color:#0f0e0c;text-decoration:none;letter-spacing:-.02em}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s var(--ease),color .2s var(--ease)}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.signout{font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:6px 10px;border-radius:100px;transition:background .2s var(--ease),color .2s var(--ease)}
.signout:hover{background:var(--bg2);color:var(--text)}
.main{max-width:1060px;margin:0 auto;padding:1.75rem 1.25rem 4rem;animation:riseIn .4s var(--ease)}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.5rem;box-shadow:var(--sh-sm);margin-bottom:1rem;transition:box-shadow .3s var(--ease)}
.greet{font-family:'Fraunces',serif;font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:-.02em;margin-bottom:.25rem}
.greet em{color:var(--green);font-style:normal}
.greet-sub{font-size:14px;color:var(--text2);margin-bottom:1.5rem}
.top-grid{display:grid;grid-template-columns:minmax(280px,1fr) 1.25fr;gap:1rem;margin-bottom:1rem}
.mid-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:840px){.top-grid,.mid-grid{grid-template-columns:1fr}}
.top-grid .card,.mid-grid .card{margin-bottom:0}
.hero-card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem 1.5rem;background:radial-gradient(120% 120% at 50% -10%,var(--gold-soft) 0%,transparent 55%),var(--bg)}
.hs-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hs-num{font-family:'Fraunces',serif;font-size:clamp(3.4rem,11vw,4.6rem);font-weight:800;line-height:.9;color:var(--text);font-variant-numeric:tabular-nums}
.hs-den{font-size:.3em;font-weight:600;color:var(--text3);letter-spacing:-.02em}
.hs-grade{display:inline-flex;align-items:center;gap:6px;margin-top:1rem;font-size:13.5px;font-weight:600;padding:8px 20px;border-radius:100px}
.g-exceeds{background:rgba(200,132,10,0.14);color:#9c6500}
[data-theme="dark"] .g-exceeds{color:var(--gold)}
.g-achieved{background:var(--green-bg);color:var(--green)}
.g-approaching{background:var(--warn-bg);color:var(--warn-text)}
.g-beginning{background:var(--info-bg);color:var(--info-text)}
.hs-sub{font-size:12.5px;color:var(--text2);margin-top:12px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.kpi{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;box-shadow:var(--sh-sm);transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease);animation:riseIn .5s var(--ease-spring) backwards}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.09s}.kpi:nth-child(3){animation-delay:.14s}.kpi:nth-child(4){animation-delay:.19s}
.kpi-ico{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);margin-bottom:10px}
.stat-num{font-family:'Fraunces',serif;font-size:1.85rem;font-weight:800;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.stat-num .unit{font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;color:var(--text3)}
.stat-lbl{font-size:11.5px;color:var(--text2);margin-top:6px}
.sect-title{font-weight:600;font-size:14px;margin-bottom:1.1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sect-title .ico-chip{width:30px;height:30px;border-radius:9px;background:var(--green-bg);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sect-title .count{margin-left:auto;font-size:12px;font-weight:400;color:var(--text2)}
.chart-wrap{position:relative;height:210px;margin-top:6px}
.chart-toggle{display:inline-flex;gap:2px;background:var(--bg2);border-radius:100px;padding:3px;margin-left:auto}
.chart-tab{font-size:12px;font-weight:500;padding:5px 13px;border:none;background:none;border-radius:100px;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;transition:background .2s var(--ease),color .2s var(--ease)}
.chart-tab.active{background:var(--bg);color:var(--text);box-shadow:var(--sh-sm)}
.chart-tab:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:12px;color:var(--text2)}
.chart-legend .lg{display:flex;align-items:center;gap:6px}
.chart-legend .sw{width:14px;height:3px;border-radius:2px;flex-shrink:0}
canvas{width:100%!important}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{width:150px;font-size:12.5px;color:var(--text);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:9px;background:var(--bg2);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;width:0;transition:width 1s var(--ease-spring)}
.bar-val{width:42px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tip{display:flex;gap:10px;align-items:flex-start;padding:.7rem .9rem;border-radius:var(--r);background:var(--bg2);font-size:14px;line-height:1.55;margin-bottom:.6rem}
.tip .ico{margin-top:3px;color:var(--green);flex-shrink:0}
.sess-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:.7rem;transition:box-shadow .3s var(--ease),border-color .2s var(--ease)}
.sess-card:last-child{margin-bottom:0}
.sess-card:hover{box-shadow:var(--sh-md);border-color:var(--border2)}
.sess-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;cursor:pointer}
.sess-name{font-weight:600;font-size:14px}
.sess-meta{font-size:12px;color:var(--text2);margin-top:3px}
.sess-body{max-height:0;opacity:0;overflow:hidden;transition:max-height .45s var(--ease-spring),opacity .3s var(--ease),margin .3s var(--ease)}
.sess-body.open{max-height:2400px;opacity:1;margin-top:14px}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;table-layout:fixed}
.ctable th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);padding:4px 0 7px;border-bottom:1px solid var(--border)}
.ctable td{padding:8px 4px 8px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.ctable tr:last-child td{border-bottom:none}
.ctable .cn{width:55%;color:var(--text)}.ctable .cs{width:45%}
.total-row{font-size:13px;color:var(--text2);margin-bottom:4px}
.total-row strong{color:var(--text);font-variant-numeric:tabular-nums}
.slbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:14px 0 6px}
.sbox{font-size:13px;color:var(--text2);line-height:1.6;padding:11px 13px;background:var(--bg);border-radius:var(--rs)}
.sbox.improve{background:var(--gold-soft);border-left:3px solid var(--gold);color:var(--text);display:flex;gap:9px;align-items:flex-start}
.sbox.improve .ico{font-size:15px;color:var(--gold);margin-top:1px}
.chevron{color:var(--text3);transition:transform .35s var(--ease-spring);flex-shrink:0;display:inline-flex;font-size:18px}
.chevron.open{transform:rotate(90deg)}
.pill{padding:3px 11px;border-radius:100px;font-size:12px;font-weight:600;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:100px;border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;text-decoration:none;transition:background .2s var(--ease),transform .15s var(--ease-spring),box-shadow .2s var(--ease)}
.btn:hover{background:var(--bg2);transform:translateY(-1px);box-shadow:var(--sh-md)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}.btn-green:hover{background:#1e3d1a;color:#fff}
[data-theme="dark"] .btn-green:hover{background:#699d65}
.btn-sm{padding:7px 12px;font-size:12.5px}
.view-work{margin-top:14px}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px}
.empty .ico{font-size:32px;color:var(--text3);display:block;margin:0 auto .75rem}
.err-box{background:var(--danger-bg);color:var(--danger-text);border-radius:var(--r);padding:1rem 1.25rem;font-size:14px;line-height:1.5}
.err-box a{color:inherit}
.spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;flex-shrink:0;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.delta{font-size:13px;font-weight:700;padding:3px 10px;border-radius:100px;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.d-up{background:var(--green-bg);color:var(--green)}
.d-dn{background:var(--danger-bg);color:var(--danger-text)}
.d-eq{background:var(--bg2);color:var(--text3)}
.pdf-modal{position:fixed;inset:0;background:var(--scrim);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.pdf-modal.open{display:flex;animation:riseIn .25s var(--ease)}
.pdf-modal-inner{background:var(--bg);border-radius:var(--r);width:100%;max-width:900px;height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-lg)}
.pdf-modal-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
footer{text-align:center;font-size:12px;color:var(--text3);padding:0 1rem 2.5rem}
.btn:focus-visible,.icon-btn:focus-visible,.signout:focus-visible,a:focus-visible,.sess-hd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}.main{padding:1rem .85rem 3rem}.bar-lbl{width:110px}}
</style>
</head>

  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>',
  layers:'<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
  flame:'<path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 1-2.5C9 9 8 11 8 13a4 4 0 0 0 8 0c0-4-4-8-4-11Z"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  chevron:'<path d="M9 18l6-6-6-6"/>',
  bulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>'
};
function ic(n){return ICONS[n]?'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>':''}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(d){try{return new Date(d).toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}catch(e){return''}}
function totOf(r){return parseInt((r.criteria_total||'0').split('/')[0])||0}

function applyThemeLabel(){var b=document.getElementById('theme-btn');if(!b)return;var dark=document.documentElement.getAttribute('data-theme')==='dark';b.innerHTML=dark?ic('sun'):ic('moon')}
function toggleTheme(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark){document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('maka-theme','light')}catch(e){}}
  else{document.documentElement.setAttribute('data-theme','dark');try{localStorage.setItem('maka-theme','dark')}catch(e){}}
  applyThemeLabel();if(RESULTS.length>=2)setTimeout(drawChart,30);
}
applyThemeLabel();

function signOut(){
  try{localStorage.removeItem('maka-student-code')}catch(e){}
  window.location.href='student-login.html';
}

function showErr(msg,withLogin){
  document.getElementById('main').innerHTML='<div class="err-box">'+ic('alert')+' '+esc(msg)
    +(withLogin?'<div style="margin-top:10px"><a href="student-login.html">Go to student sign in →</a></div>':'')+'</div>';
}

function gradeCls(g){g=g||'';return g.includes('Exceeds')?'g-exceeds':g.includes('Achieved')?'g-achieved':g.includes('Approaching')?'g-approaching':'g-beginning'}
function gradeWord(g){g=g||'';return g.includes('Exceeds')?'Exceeding expectations — amazing!':g.includes('Achieved')?'Achieved — well done!':g.includes('Approaching')?'Almost there — keep going!':g?'Just getting started — kia kaha!':''}

async function load(){
  if(!CODE){
    window.location.replace('student-login.html');
    return;
  }
  try{
    sb=supabase.createClient(SURL,SKEY);
    var res=await sb.rpc('student_hub',{code:CODE});
    if(res.error)throw new Error(res.error.message);
    var d=res.data||{};
    if(!d.student){
      try{localStorage.removeItem('maka-student-code')}catch(e){}
      showErr('We couldn’t find your page with that code. Ask your teacher to check your code, then sign in again.',true);
      return;
    }
    STU=d.student;RESULTS=d.results||[];
    document.getElementById('signout-btn').style.display='';
    render();
  }catch(e){showErr('Something went wrong loading your page: '+e.message,true)}
}

function render(){
  var first=esc((STU.name||'').split(' ')[0]);
  document.title='Māka — '+(STU.name||'My Learning');

  var totals=RESULTS.map(totOf);
  var avg=totals.length?(totals.reduce(function(a,b){return a+b},0)/totals.length).toFixed(1):'—';
  var best=totals.length?Math.max.apply(null,totals):'—';
  var latestT=totals.length?totals[totals.length-1]:null;
  var prevT=totals.length>1?totals[totals.length-2]:null;
  var trend=latestT!==null&&prevT!==null?latestT-prevT:null;
  var trendHtml=trend===null?'<span style="color:var(--text3);font-size:1.3rem">—</span>':trend>0?'<span class="delta d-up">↑ +'+trend+'</span>':trend<0?'<span class="delta d-dn">↓ '+trend+'</span>':'<span class="delta d-eq">→ 0</span>';

  var latest=RESULTS.length?RESULTS[RESULTS.length-1]:null;

  var hero=latest
    ?'<div class="card hero-card">'
      +'<div class="hs-label">'+ic('award')+'Your latest result</div>'
      +'<div class="hs-num">'+totOf(latest)+'<span class="hs-den">/25</span></div>'
      +'<div class="hs-grade '+gradeCls(latest.overall_score)+'">'+ic('trophy')+esc(gradeWord(latest.overall_score))+'</div>'
      +'<div class="hs-sub">'+esc(latest.session_name||'')+(latest.learning_area?' · '+esc(latest.learning_area):'')+'</div>'
    +'</div>'
    :'<div class="card hero-card"><div class="empty" style="padding:1rem">'+ic('sprout')+'<div>No marked work yet — your results will show up here once your teacher marks your mahi.</div></div></div>';

  var kpis='<div class="kpi-grid">'
    +'<div class="kpi"><div class="kpi-ico">'+ic('layers')+'</div><div class="stat-num">'+RESULTS.length+'</div><div class="stat-lbl">Pieces of work marked</div></div>'
    +'<div class="kpi"><div class="kpi-ico">'+ic('chart')+'</div><div class="stat-num">'+avg+'<span class="unit">'+(avg!=='—'?'/25':'')+'</span></div><div class="stat-lbl">Your average</div></div>'
    +'<div class="kpi"><div class="kpi-ico">'+ic('trophy')+'</div><div class="stat-num">'+best+'<span class="unit">'+(best!=='—'?'/25':'')+'</span></div><div class="stat-lbl">Your best score</div></div>'
    +'<div class="kpi"><div class="kpi-ico">'+ic('flame')+'</div><div style="display:flex;align-items:center;min-height:1.85rem">'+trendHtml+'</div><div class="stat-lbl">Since last time</div></div>'
  +'</div>';

  var tips='';
  if(latest){
    var t1=latest.strengths||'';
    var t2=(latest.next_steps&&latest.next_steps[0])||'';
    if(t1||t2){
      tips='<div class="card"><div class="sect-title"><span class="ico-chip">'+ic('star')+'</span>Your latest feedback</div>'
        +(t1?'<div class="tip">'+ic('star')+'<div><strong>What you did well:</strong> '+esc(t1)+'</div></div>':'')
        +(t2?'<div class="tip">'+ic('arrow')+'<div><strong>Your next step:</strong> '+esc(t2)+'</div></div>':'')
      +'</div>';
    }
  }

  var chartCard='<div class="card" id="chart-card">'
    +'<div class="sect-title"><span class="ico-chip">'+ic('chart')+'</span>Your progress over time'
    +(RESULTS.length<2?'':'<div class="chart-toggle" role="tablist"><button role="tab" id="ct-total" class="chart-tab active" onclick="setChartMode(\'total\')">Total</button><button role="tab" id="ct-crit" class="chart-tab" onclick="setChartMode(\'criteria\')">By skill</button></div>')
    +'</div>'
    +(RESULTS.length<2
      ?'<div class="empty">'+ic('chart')+'<div>Once you have 2 or more pieces of marked work, your progress chart will appear here.</div></div>'
      :'<div class="chart-wrap"><canvas id="progress-chart"></canvas></div><div id="chart-legend" class="chart-legend"></div>')
  +'</div>';

  var barsCard='<div class="card"><div class="sect-title"><span class="ico-chip">'+ic('target')+'</span>Your average by skill</div><div id="crit-bars">'+renderCritBars()+'</div></div>';

  var work='';
  if(RESULTS.length){
    var revd=RESULTS.slice().reverse();
    work='<div class="card"><div class="sect-title"><span class="ico-chip">'+ic('book')+'</span>All your marked work<span class="count">'+RESULTS.length+' piece'+(RESULTS.length!==1?'s':'')+'</span></div>'
      +revd.map(function(r,i){
        var crit=(r.criteria||[]).map(function(c){
          var s=parseInt(c.score)||0,dotsHtml='';
          for(var x=1;x<=5;x++)dotsHtml+='<span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;background:'+(x<=s?'var(--green)':'var(--border2)')+'"></span>';
          return'<tr><td class="cn">'+esc((c.name||'').split('—')[0].trim())+'</td><td class="cs">'+dotsHtml+'<span style="font-size:11px;color:var(--text2);margin-left:3px">'+s+'/5</span></td></tr>';
        }).join('');
        var i1=r.strengths||'',i2=(r.next_steps&&r.next_steps[0])||'';
        var date=r.session_date?fmtDate(r.session_date):fmtDate(r.created_at);
        return'<div class="sess-card">'
          +'<div class="sess-hd" tabindex="0" role="button" aria-expanded="false" onclick="toggleSess(\'s'+i+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleSess(\'s'+i+'\')}">'
            +'<div style="min-width:0"><div class="sess-name">'+esc(r.session_name||'Session')+'</div><div class="sess-meta">'+(r.learning_area?esc(r.learning_area)+' · ':'')+date+'</div></div>'
            +'<div style="display:flex;align-items:center;gap:10px"><span class="pill '+gradeCls(r.overall_score)+'">'+esc(r.overall_score||'')+' · '+esc(r.criteria_total||'')+'</span><span class="chevron" id="chev-s'+i+'">'+ic('chevron')+'</span></div>'
          +'</div>'
          +'<div class="sess-body" id="s'+i+'">'
            +(crit?'<table class="ctable"><thead><tr><th>Skill</th><th>Score</th></tr></thead><tbody>'+crit+'</tbody></table>':'')
            +'<div class="total-row">Total: <strong>'+esc(r.criteria_total||'')+'</strong></div>'
            +((i1||i2)?'<div class="slbl">How to improve</div>':'')
            +(i1?'<div class="sbox improve" style="margin-bottom:6px">'+ic('bulb')+'<span>'+esc(i1)+'</span></div>':'')
            +(i2?'<div class="sbox improve">'+ic('bulb')+'<span>'+esc(i2)+'</span></div>':'')
            +(r.pdf_url?'<button class="btn btn-green btn-sm view-work" onclick="viewPDF(this.dataset.u)" data-u="'+esc(r.pdf_url)+'">'+ic('file')+' View your work</button>':'')
          +'</div>'
        +'</div>';
      }).join('')
    +'</div>';
  }

  document.getElementById('main').innerHTML=
    '<div class="greet">Kia ora, <em>'+first+'</em>!</div>'
    +'<div class="greet-sub">This is your learning page — see how you’re going and what to work on next.'+(STU.year_level?' · '+esc(STU.year_level):'')+'</div>'
    +'<div class="top-grid">'+hero+kpis+'</div>'
    +tips
    +'<div class="mid-grid">'+chartCard+barsCard+'</div>'
    +work;

  if(RESULTS.length>=2)setTimeout(drawChart,50);

  // Animate count-up numbers + bar fills (mirrors the teacher hub)
  setTimeout(function(){
    document.querySelectorAll('.stat-num').forEach(function(el){
      var m=el.textContent.match(/^(\d+(?:\.\d+)?)/);
      if(!m)return;
      var target=parseFloat(m[1]),isFloat=m[1].indexOf('.')!==-1;
      var t0=performance.now(),dur=700;
      var span=el.querySelector('span');
      el.innerHTML='';var tn=document.createTextNode('0');el.appendChild(tn);if(span)el.appendChild(span);
      function tick(now){
        var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
        var v=target*e;
        tn.textContent=(isFloat?v.toFixed(1):Math.round(v))+'';
        if(p<1)requestAnimationFrame(tick);else tn.textContent=m[1];
      }
      requestAnimationFrame(tick);
    });
    document.querySelectorAll('.bar-fill').forEach(function(el){var w=el.style.width;el.style.width='0';requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=w})})});
  },80);
}

function renderCritBars(){
  var withCrit=RESULTS.filter(function(r){return r.criteria&&r.criteria.length});
  if(!withCrit.length)return'<div class="empty">'+ic('target')+'<div>No skill scores yet.</div></div>';
  var latest=withCrit[withCrit.length-1];
  var cn=latest.criteria.map(function(c){return c.name||''});
  return cn.map(function(name,ci){
    var vals=withCrit.filter(function(r){return r.criteria[ci]}).map(function(r){return parseInt(r.criteria[ci].score)||0});
    var a=vals.length?(vals.reduce(function(x,y){return x+y},0)/vals.length):0;
    var pct=Math.round(a/5*100);
    var col=pct>=70?'var(--green)':pct>=50?'var(--warn-text)':'var(--danger-text)';
    return'<div class="bar-row"><div class="bar-lbl" title="'+esc(name)+'">'+esc(name.split('—')[0].trim())+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div><div class="bar-val">'+a.toFixed(1)+'</div></div>';
  }).join('');
}

function toggleSess(id){
  var body=document.getElementById(id);
  var chev=document.getElementById('chev-'+id);
  if(!body)return;
  var open=body.classList.toggle('open');
  if(chev)chev.classList.toggle('open',open);
  var hd=body.previousElementSibling;if(hd&&hd.setAttribute)hd.setAttribute('aria-expanded',open?'true':'false');
}

function viewPDF(url){
  if(!url)return;
  var m=document.getElementById('pdf-modal');
  document.getElementById('pdf-frame').src=url;
  document.getElementById('pdf-open-new').href=url;
  m.classList.add('open');
  document.addEventListener('keydown',pdfEsc);
}
function closePdfModal(){
  var m=document.getElementById('pdf-modal');m.classList.remove('open');
  document.getElementById('pdf-frame').src='';
  document.removeEventListener('keydown',pdfEsc);
}
function pdfEsc(e){if(e.key==='Escape')closePdfModal()}

// ── Progress chart (canvas, total + by-skill) ────────────────────────────────
var CHART_MODE='total';
var CRIT_COLORS=['#2d5a27','#c8840a','#185fa5','#8b1a5e','#5a564e','#1e7a6b','#a14d12'];
function setChartMode(m){
  CHART_MODE=m;
  var t=document.getElementById('ct-total'),c=document.getElementById('ct-crit');
  if(t)t.classList.toggle('active',m==='total');
  if(c)c.classList.toggle('active',m==='criteria');
  drawChart();
}
function isDark(){return document.documentElement.getAttribute('data-theme')==='dark'}
function drawChart(){
  var canvas=document.getElementById('progress-chart');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var wrap=canvas.parentElement;
  var W=wrap.clientWidth,H=210;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);

  var dark=isDark();
  var gridCol=dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)';
  var axisCol=dark?'rgba(236,233,227,0.5)':'rgba(0,0,0,0.4)';
  var dotFill=dark?'#1c1b19':'#fff';
  var labels=RESULTS.map(function(r){return r.session_name?(r.session_name.substring(0,20)):'Session'});

  var pad={t:20,r:20,b:50,l:40};
  var cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var n=RESULTS.length;
  var xStep=n>1?cw/(n-1):cw;
  function xPos(i){return pad.l+(n>1?i*xStep:cw/2)}

  var legend=document.getElementById('chart-legend');

  if(CHART_MODE==='criteria'){
    var names=[];
    RESULTS.forEach(function(r){(r.criteria||[]).forEach(function(c){var nm=(c.name||'').split('—')[0].trim();if(nm&&names.indexOf(nm)===-1)names.push(nm)})});
    if(!names.length){setChartMode('total');return}
    var maxV=5;
    function yPos(v){return pad.t+ch-(v/maxV)*ch}
    ctx.strokeStyle=gridCol;ctx.lineWidth=1;
    [0,1,2,3,4,5].forEach(function(v){var y=yPos(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText(v,pad.l-6,y+3)});
    names.forEach(function(nm,si){
      var col=CRIT_COLORS[si%CRIT_COLORS.length];
      var series=RESULTS.map(function(r){var found=(r.criteria||[]).find(function(c){return(c.name||'').split('—')[0].trim()===nm});return found?(parseInt(found.score)||0):null});
      ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';
      var started=false;
      series.forEach(function(v,i){if(v===null)return;var x=xPos(i),y=yPos(v);started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true});
      ctx.stroke();
      series.forEach(function(v,i){if(v===null)return;var x=xPos(i),y=yPos(v);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fillStyle=dotFill;ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke()});
    });
    ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='center';
    RESULTS.forEach(function(r,i){var lbl=labels[i];if(lbl.length>12)lbl=lbl.substring(0,12)+'…';ctx.save();ctx.translate(xPos(i),pad.t+ch+14);ctx.rotate(-0.4);ctx.fillText(lbl,0,0);ctx.restore()});
    if(legend)legend.innerHTML=names.map(function(nm,si){return'<span class="lg"><span class="sw" style="background:'+CRIT_COLORS[si%CRIT_COLORS.length]+'"></span>'+esc(nm)+'</span>'}).join('');
  }else{
    var data=RESULTS.map(totOf);
    var maxVal=25,green=dark?'#7fb87a':'#2d5a27';
    function yPosT(v){return pad.t+ch-(v/maxVal)*ch}
    ctx.strokeStyle=gridCol;ctx.lineWidth=1;
    [0,5,10,15,20,25].forEach(function(v){var y=yPosT(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText(v,pad.l-6,y+3)});
    ctx.beginPath();ctx.moveTo(xPos(0),yPosT(data[0]));data.forEach(function(v,i){if(i>0)ctx.lineTo(xPos(i),yPosT(v))});ctx.lineTo(xPos(n-1),pad.t+ch);ctx.lineTo(xPos(0),pad.t+ch);ctx.closePath();ctx.fillStyle=dark?'rgba(127,184,122,0.12)':'rgba(45,90,39,0.08)';ctx.fill();
    ctx.beginPath();ctx.strokeStyle=green;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';data.forEach(function(v,i){i===0?ctx.moveTo(xPos(i),yPosT(v)):ctx.lineTo(xPos(i),yPosT(v))});ctx.stroke();
    data.forEach(function(v,i){var x=xPos(i),y=yPosT(v);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=dotFill;ctx.fill();ctx.strokeStyle=green;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=green;ctx.font='bold 11px DM Sans,sans-serif';ctx.textAlign='center';ctx.fillText(v+'/25',x,y-10);ctx.fillStyle=axisCol;ctx.font='10px DM Sans,sans-serif';var lbl=labels[i];if(lbl.length>12)lbl=lbl.substring(0,12)+'…';ctx.save();ctx.translate(x,pad.t+ch+14);ctx.rotate(-0.4);ctx.fillText(lbl,0,0);ctx.restore()});
    if(legend)legend.innerHTML='';
  }
}
window.addEventListener('resize',function(){if(RESULTS.length>=2)drawChart()});

load();
</script>
</body>
</html>
